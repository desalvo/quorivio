apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-quorivio
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app: quorivio, release: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: quorivio, release: {{ .Release.Name }}}
    spec:
{{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: converter
          image: {{ .Values.converter.image | quote }}
          ports: [{name: converter, containerPort: 8099}]
          env:
            - name: QUORIVIO_WORKER_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: QUORIVIO_WORKER_TOKEN}}
            - name: QUORIVIO_CONVERSION_DIR
              value: /conversions
          volumeMounts:
            - {name: conversions, mountPath: /conversions}
            - {name: converter-tmp, mountPath: /tmp}
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources:
{{ toYaml .Values.converter.resources | indent 12 }}
        # Local antivirus process managed by this pod; socket is never published.
        - name: clamav
          image: {{ .Values.antivirus.image | quote }}
          imagePullPolicy: IfNotPresent
          ports: [{name: clamd, containerPort: 3310}]
          readinessProbe:
            tcpSocket: {port: clamd}
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
{{ toYaml .Values.antivirus.resources | indent 12 }}
        - name: quorivio
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          env:
            - name: QUORIVIO_ENABLE_CONVERTER
              value: "true"
            - name: QUORIVIO_CONVERTER_WORKER_URL
              value: "http://127.0.0.1:8099"
            - name: QUORIVIO_CONVERSION_DIR
              value: /conversions
            - name: QUORIVIO_WORKER_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: QUORIVIO_WORKER_TOKEN}}
            - name: QUORIVIO_AV_REQUIRED
              value: "true"
            - name: CLAMAV_HOST
              value: "127.0.0.1"
            - name: CLAMAV_PORT
              value: "3310"
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: PUBLIC_BASE_URL
              value: {{ .Values.publicBaseUrl | quote }}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: DATABASE_URL}}
            - name: AUTH_SECRET
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: AUTH_SECRET}}
            - name: ADMIN_EMAIL
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: ADMIN_EMAIL}}
            - name: ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: ADMIN_PASSWORD}}
          volumeMounts:
            - {name: conversions, mountPath: /conversions}
            - name: assets
              mountPath: /app/assets
          readinessProbe:
            httpGet: {path: /api/health/ready, port: http}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /api/health/live, port: http}
            initialDelaySeconds: 10
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources:
{{ toYaml .Values.resources | indent 12 }}

      volumes:
        - name: conversions
          emptyDir: {}
        - name: converter-tmp
          emptyDir: {}
        - name: assets
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-assets" .Release.Name) .Values.assets.existingClaim }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-quorivio
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: {app: quorivio, release: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: quorivio, release: {{ .Release.Name }}}
    spec:
      automountServiceAccountToken: false
{{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
{{- if and (gt (int .Values.replicaCount) 1) (ne .Values.assets.accessMode "ReadWriteMany") }}
{{- fail "multiple replicas require RWX assets.accessMode=ReadWriteMany and real shared storage" }}
{{- end }}
{{- if and .Values.enforceNodeDiversity (lt (int .Values.replicaCount) 2) }}
{{- fail "enforceNodeDiversity requires at least two replicas" }}
{{- end }}
{{- if and (gt (int .Values.replicaCount) 1) .Values.backup.posix.enabled (ne .Values.backup.posix.accessMode "ReadWriteMany") }}
{{- fail "multi-replica POSIX backup volume must be ReadWriteMany" }}
{{- end }}
{{- if and .Values.backup.nfs.enabled (not .Values.backup.nfs.existingClaim) (or (not .Values.backup.nfs.server) (not .Values.backup.nfs.path)) }}
{{- fail "NFS backup requires an existingClaim or both server and path" }}
{{- end }}
{{- if and .Values.backup.bootstrap.enabled (not .Values.backup.bootstrap.existingSecret) (not .Values.backup.bootstrap.target) }}
{{- fail "backup bootstrap schedule requires an existingSecret or a target" }}
{{- end }}
{{- if gt (int .Values.replicaCount) 1 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ ternary "DoNotSchedule" "ScheduleAnyway" .Values.enforceNodeDiversity }}
{{- if .Values.enforceNodeDiversity }}
          minDomains: 2
{{- end }}
          labelSelector:
            matchLabels: {app: quorivio, release: {{ .Release.Name }}}
{{- end }}
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: converter
          image: {{ .Values.converter.image | quote }}
          ports: [{name: converter, containerPort: 8099}]
          env:
            - name: QUORIVIO_WORKER_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: QUORIVIO_WORKER_TOKEN}}
            - name: QUORIVIO_CONVERSION_DIR
              value: /conversions
            - name: QUORIVIO_CAPTURE_BASE_URL
              value: "http://127.0.0.1:8080"
          volumeMounts:
            - {name: conversions, mountPath: /conversions}
            - {name: converter-tmp, mountPath: /tmp}
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources:
{{ toYaml .Values.converter.resources | indent 12 }}
        # Local antivirus process managed by this pod; socket is never published.
        - name: clamav
          image: {{ .Values.antivirus.image | quote }}
          imagePullPolicy: IfNotPresent
          ports: [{name: clamd, containerPort: 3310}]
          readinessProbe:
            tcpSocket: {port: clamd}
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
{{ toYaml .Values.antivirus.resources | indent 12 }}
        - name: quorivio
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          env:
            - name: QUORIVIO_ENABLE_CONVERTER
              value: "true"
            - name: QUORIVIO_CONVERTER_WORKER_URL
              value: "http://127.0.0.1:8099"
            - name: QUORIVIO_CONVERSION_DIR
              value: /conversions
            - name: QUORIVIO_WORKER_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: QUORIVIO_WORKER_TOKEN}}
            - name: QUORIVIO_BACKUP_BOOTSTRAP_ENABLED
              value: {{ .Values.backup.bootstrap.enabled | quote }}
            - name: QUORIVIO_BACKUP_BOOTSTRAP_INTERVAL_HOURS
              value: {{ .Values.backup.bootstrap.intervalHours | quote }}
{{- if .Values.backup.bootstrap.existingSecret }}
            - name: QUORIVIO_BACKUP_BOOTSTRAP_TARGET_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backup.bootstrap.existingSecret | quote }}
                  key: {{ .Values.backup.bootstrap.targetKey | quote }}
{{- else if .Values.backup.bootstrap.target }}
            - name: QUORIVIO_BACKUP_BOOTSTRAP_TARGET_JSON
              value: {{ toJson .Values.backup.bootstrap.target | quote }}
{{- end }}
            - name: QUORIVIO_BACKUP_ALLOWED_BACKENDS
              value: {{ join "," (concat .Values.backup.allowedBackends (ternary (list "posix") (list) .Values.backup.posix.enabled) (ternary (list "nfs") (list) .Values.backup.nfs.enabled)) | quote }}
{{- if .Values.backup.posix.enabled }}
            - name: QUORIVIO_BACKUP_POSIX_ROOT
              value: /app/backups-posix
{{- end }}
{{- if .Values.backup.nfs.enabled }}
            - name: QUORIVIO_BACKUP_NFS_ROOT
              value: /app/backups-nfs
{{- end }}
            - name: QUORIVIO_AV_REQUIRED
              value: "true"
            - name: CLAMAV_HOST
              value: "127.0.0.1"
            - name: CLAMAV_PORT
              value: "3310"
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: PUBLIC_BASE_URL
              value: {{ .Values.publicBaseUrl | quote }}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: DATABASE_URL}}
            - name: AUTH_SECRET
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: AUTH_SECRET}}
            - name: ADMIN_EMAIL
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: ADMIN_EMAIL}}
            - name: ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: ADMIN_PASSWORD}}
          volumeMounts:
            - {name: conversions, mountPath: /conversions}
            - {name: app-tmp, mountPath: /tmp}
            - name: assets
              mountPath: /app/assets
{{- if .Values.backup.posix.enabled }}
            - name: backup-posix
              mountPath: /app/backups-posix
{{- end }}
{{- if .Values.backup.nfs.enabled }}
            - name: backup-nfs
              mountPath: /app/backups-nfs
{{- end }}
          readinessProbe:
            httpGet: {path: /api/health/ready, port: http}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /api/health/live, port: http}
            initialDelaySeconds: 10
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources:
{{ toYaml .Values.resources | indent 12 }}

      volumes:
        - name: conversions
          emptyDir: {}
        - name: converter-tmp
          emptyDir: {}
        - name: app-tmp
          emptyDir:
            sizeLimit: {{ .Values.backup.tmpSize | quote }}
        - name: assets
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-assets" .Release.Name) .Values.assets.existingClaim }}
{{- if .Values.backup.posix.enabled }}
        - name: backup-posix
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-backup-posix" .Release.Name) .Values.backup.posix.existingClaim }}
{{- end }}
{{- if .Values.backup.nfs.enabled }}
        - name: backup-nfs
{{- if .Values.backup.nfs.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.backup.nfs.existingClaim | quote }}
{{- else }}
          nfs:
            server: {{ .Values.backup.nfs.server | quote }}
            path: {{ .Values.backup.nfs.path | quote }}
{{- end }}
{{- end }}

{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-quorivio
{{- $defaults := dict }}
{{- if eq .Values.ingress.className "nginx" }}
{{- $_ := set $defaults "nginx.ingress.kubernetes.io/proxy-read-timeout" "900" }}
{{- $_ := set $defaults "nginx.ingress.kubernetes.io/proxy-send-timeout" "900" }}
{{- else if hasPrefix "haproxy" .Values.ingress.className }}
{{- $_ := set $defaults "haproxy.org/timeout-server" "900s" }}
{{- end }}
{{- $annotations := mergeOverwrite $defaults (.Values.ingress.annotations | default dict) }}
{{- with $annotations }}
  annotations:
{{ toYaml . | indent 4 }}
{{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
{{- if .Values.ingress.tlsTermination }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
{{- if .Values.ingress.tlsSecret }}
      secretName: {{ .Values.ingress.tlsSecret | quote }}
{{- end }}
{{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-quorivio
                port: {name: http}
{{- end }}

image:
  repository: desalvo/quorivio
  tag: latest
  pullPolicy: IfNotPresent
replicaCount: 1
# Opt-in: prevent both replicas from sharing one Kubernetes hostname (requires >=2 schedulable nodes).
enforceNodeDiversity: false
nodeSelector: {}
service:
  port: 8080
publicBaseUrl: https://quorivio.example.org
existingSecret: quorivio-secret
resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: "1"
    memory: 512Mi
ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: quorivio.example.org
  tlsTermination: true
  tlsSecret: ""

# ClamAV is managed as a private sidecar per Quorivio pod.
antivirus:
  image: clamav/clamav:stable
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi

# Required for persisted files. For multiple replicas use a RWX-capable StorageClass.
assets:
  existingClaim: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  storageClassName: ""

converter:
  image: "desalvo/quorivio-converter:0.1.0-dev"
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "2", memory: 2Gi}

image:
  repository: desalvo/quorivio
  tag: latest
  pullPolicy: Always
replicaCount: 1
# Opt-in: prevent both replicas from sharing one Kubernetes hostname (requires >=2 schedulable nodes).
enforceNodeDiversity: false
nodeSelector: {}
service:
  port: 8080
publicBaseUrl: https://quorivio.example.org
existingSecret: quorivio-secret
resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: "1"
    memory: 512Mi
ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: quorivio.example.org
  tlsTermination: true
  tlsSecret: ""

# ClamAV is managed as a private sidecar per Quorivio pod.
antivirus:
  image: clamav/clamav:stable
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi

# Required for persisted files. For multiple replicas use a RWX-capable StorageClass.
assets:
  existingClaim: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  storageClassName: ""

converter:
  image: "desalvo/quorivio-converter:latest"
  imagePullPolicy: Always
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "2", memory: 2Gi}

# RC270 full-instance backup configuration. Volume sources are Helm-time settings;
# the administrator wizard chooses destinations and schedules inside mounted roots.
backup:
  tmpSize: 20Gi # disk-backed scratch for PostgreSQL dump + compressed archive
  allowedBackends: [s3, webdav]
  posix:
    enabled: false
    existingClaim: ""
    accessMode: ReadWriteOnce
    size: 20Gi
    storageClassName: ""
  nfs:
    enabled: false
    existingClaim: ""
    server: ""
    path: ""

  # Bootstrap only when there is no existing saved backup target. Prefer a
  # Kubernetes Secret containing JSON key BACKUP_TARGET_JSON (credentials).
  # target values must not include credentials; they appear in Helm releases.
  bootstrap:
    enabled: false
    intervalHours: 24
    existingSecret: ""
    targetKey: BACKUP_TARGET_JSON
    target: {}

image:
  repository: ghcr.io/replace-me/quorivio
  tag: 0.1.0-dev
  pullPolicy: IfNotPresent
replicaCount: 1
service:
  port: 8080
publicBaseUrl: https://quorivio.example.org
existingSecret: quorivio-secret
resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: "1"
    memory: 512Mi
ingress:
  enabled: false
  className: nginx
  host: quorivio.example.org
  tlsSecret: quorivio-tls

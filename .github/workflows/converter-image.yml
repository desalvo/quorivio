name: Publish Quorivio PDF/PPTX converter (manual only)

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: 'I explicitly authorize publishing the converter image to Docker Hub'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  publish-converter:
    name: Build and publish isolated converter image (amd64/arm64)
    if: >-
      ${{ github.repository == 'desalvo/quorivio' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) &&
          github.event_name == 'workflow_dispatch' && inputs.confirm_publish == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate target image tags without shell interpolation
        id: tags
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'desalvo/quorivio'
          if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
            image_tag=latest
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            image_tag="${GITHUB_REF#refs/tags/}"
            [[ "$image_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,100}$ ]]
            [ "$image_tag" != latest ] || { echo 'A release tag cannot replace latest'; exit 1; }
          else
            echo 'Converter publishing requires main or an explicit Git release tag' >&2
            exit 1
          fi
          echo "tags=desalvo/quorivio-converter:$image_tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Docker Hub authentication
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build, scan boundary and publish multiarch converter
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.converter
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          push: true
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/desalvo/quorivio
            org.opencontainers.image.licenses=EUPL-1.2
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify multiarch publication and digest
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "desalvo/quorivio-converter@$IMAGE_DIGEST" > /tmp/quorivio-converter-manifest.txt
          grep -q 'linux/amd64' /tmp/quorivio-converter-manifest.txt
          grep -q 'linux/arm64' /tmp/quorivio-converter-manifest.txt
          echo "Validated converter image digest: $IMAGE_DIGEST"

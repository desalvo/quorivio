name: Quorivio CI and Docker Hub
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*', '0.*', '1.*', '2.*']
  workflow_dispatch:
    inputs:
      browser_test:
        description: 'Run Chromium editor UI acceptance (manual opt-in until fixture is validated)'
        type: boolean
        default: false
      capacity_test:
        description: 'Run 500-participant disposable PostgreSQL acceptance (manual only)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Production quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: quorivio
          POSTGRES_USER: quorivio
          POSTGRES_PASSWORD: ci-only-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quorivio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'} # npm caching requires a committed package-lock.json
      - name: Install reproducibly
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Compile frontend and backend
        run: npm run build
      - name: Chromium editor UI acceptance (opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.browser_test
        timeout-minutes: 8
        run: |
          python3 -m pip install --disable-pip-version-check --break-system-packages 'playwright>=1.50,<2'
          python3 -m playwright install --with-deps chromium
          npm run dev:web > /tmp/quorivio-ci-vite.log 2>&1 &
          echo $! > /tmp/quorivio-ci-vite.pid
          trap 'kill $(cat /tmp/quorivio-ci-vite.pid) || true; tail -80 /tmp/quorivio-ci-vite.log' EXIT
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --show-error http://127.0.0.1:5173/
          python3 tools/ci_browser_editor.py
      - name: Install PostgreSQL 18 client for integration and disaster recovery
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo '/usr/lib/postgresql/18/bin' >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version | grep -Eq '^pg_dump \(PostgreSQL\) 18\.'
          /usr/lib/postgresql/18/bin/pg_restore --version | grep -Eq '^pg_restore \(PostgreSQL\) 18\.'
      - name: Generate ephemeral CI load-test credential
        run: echo "QUORIVIO_CI_LOAD_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Start API against real PostgreSQL
        env:
          DATABASE_URL: postgres://quorivio:ci-only-secret@127.0.0.1:5432/quorivio
          AUTH_SECRET: ci-only-integration-secret-must-be-long-enough-123
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: ci-only-administrator-password-123
          PUBLIC_BASE_URL: http://127.0.0.1:8080
          PORT: '8080'
          QUORIVIO_ASSET_DIR: /tmp/quorivio-ci-assets
          QUORIVIO_CONVERSION_DIR: /tmp/quorivio-ci-conversions
          LOAD_TEST_TOKEN: ${{ env.QUORIVIO_CI_LOAD_TOKEN }}
        run: |
          node apps/api/dist/server.js > /tmp/quorivio-ci-api.log 2>&1 &
          echo $! > /tmp/quorivio-ci-api.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/health/ready >/dev/null; then break; fi
            if ! kill -0 $(cat /tmp/quorivio-ci-api.pid) 2>/dev/null; then cat /tmp/quorivio-ci-api.log; exit 1; fi
            sleep 1
          done
          curl --fail --show-error http://127.0.0.1:8080/api/health/ready
          curl --fail --show-error http://127.0.0.1:8080/api/health/live
          curl --fail --show-error http://127.0.0.1:8080/ > /tmp/quorivio-ci-home.html
          grep -qi 'html' /tmp/quorivio-ci-home.html
      - name: Assert database bootstrapping and baseline auth
        env:
          PGPASSWORD: ci-only-secret
        run: |
          test "$(psql -h 127.0.0.1 -U quorivio -d quorivio -Atc 'SELECT count(*) FROM users')" = '1'
          test "$(psql -h 127.0.0.1 -U quorivio -d quorivio -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('auth_flows','api_rate_windows','widget_answers')")" = '3'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/auth/me)" = '401'
      - name: PostgreSQL-backed portable and profile lifecycle E2E
        env:
          QUORIVIO_CI_ADMIN_EMAIL: admin@example.com
          QUORIVIO_CI_ADMIN_PASSWORD: ci-only-administrator-password-123
          QUORIVIO_CI_NEW_PASSWORD: ci-only-changed-admin-password-123
        run: python3 tools/ci_portable_http.py
      - name: PostgreSQL-backed concurrent live lifecycle E2E
        env:
          QUORIVIO_CI_LOAD_TOKEN: ${{ env.QUORIVIO_CI_LOAD_TOKEN }}
          QUORIVIO_CI_ADMIN_EMAIL: admin@example.com
          QUORIVIO_CI_NEW_PASSWORD: ci-only-changed-admin-password-123
        run: python3 tools/ci_live_http.py
      - name: Start second API replica against shared PostgreSQL 18
        env:
          DATABASE_URL: postgres://quorivio:ci-only-secret@127.0.0.1:5432/quorivio
          AUTH_SECRET: ci-only-integration-secret-must-be-long-enough-123
          PUBLIC_BASE_URL: http://127.0.0.1:8080
          PORT: '8081'
          QUORIVIO_ASSET_DIR: /tmp/quorivio-ci-assets
          QUORIVIO_CONVERSION_DIR: /tmp/quorivio-ci-conversions
          LOAD_TEST_TOKEN: ${{ env.QUORIVIO_CI_LOAD_TOKEN }}
        run: |
          node apps/api/dist/server.js > /tmp/quorivio-ci-replica.log 2>&1 &
          echo $! > /tmp/quorivio-ci-replica.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8081/api/health/ready >/dev/null; then break; fi
            if ! kill -0 $(cat /tmp/quorivio-ci-replica.pid) 2>/dev/null; then cat /tmp/quorivio-ci-replica.log; exit 1; fi
            sleep 1
          done
          curl --fail --show-error http://127.0.0.1:8081/api/health/ready
      - name: PostgreSQL two-replica WebSocket and privacy E2E
        env:
          QUORIVIO_CI_LOAD_TOKEN: ${{ env.QUORIVIO_CI_LOAD_TOKEN }}
          QUORIVIO_CI_ADMIN_EMAIL: admin@example.com
          QUORIVIO_CI_NEW_PASSWORD: ci-only-changed-admin-password-123
        run: |
          python3 -m pip install --disable-pip-version-check --break-system-packages 'aiohttp>=3.9,<4'
          python3 tools/ci_live_replicas.py
      - name: Optional 500-participant PostgreSQL/WebSocket acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.capacity_test
        timeout-minutes: 6
        env:
          QUORIVIO_CI_LOAD_TOKEN: ${{ env.QUORIVIO_CI_LOAD_TOKEN }}
          QUORIVIO_CI_ADMIN_EMAIL: admin@example.com
          QUORIVIO_CI_NEW_PASSWORD: ci-only-changed-admin-password-123
        run: python3 tools/ci_capacity_500.py
      - name: PostgreSQL 18 disaster recovery backup and restore acceptance
        env:
          DATABASE_URL: postgres://quorivio:ci-only-secret@127.0.0.1:5432/quorivio
          QUORIVIO_ASSET_DIR: /tmp/quorivio-ci-assets
        run: python3 tools/ci_backup_restore.py
      - name: Stop integration API
        if: always()
        run: |
          if [ -f /tmp/quorivio-ci-replica.pid ]; then kill $(cat /tmp/quorivio-ci-replica.pid) || true; fi
          if [ -f /tmp/quorivio-ci-replica.log ]; then tail -60 /tmp/quorivio-ci-replica.log; fi
          if [ -f /tmp/quorivio-ci-api.pid ]; then kill $(cat /tmp/quorivio-ci-api.pid) || true; fi
          if [ -f /tmp/quorivio-ci-api.log ]; then tail -60 /tmp/quorivio-ci-api.log; fi
      - name: Vulnerability gate (high and critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Install Python conversion and load-test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python3 -m pip install --disable-pip-version-check --break-system-packages 'reportlab>=4,<5' 'python-pptx>=1.0,<2' 'aiohttp>=3.9,<4'
          python3 -c 'import reportlab' # fail gate rather than skipping the PDF rendering test
          python3 -c 'import pptx, aiohttp' # enforce PPTX and load-test integration prerequisites
      - name: Kubernetes wizard and worker integration tests
        run: |
          PYTHONPATH=tools python3 -m unittest discover -s tools/tests -v
          python3 -m unittest tools.tests.test_import_presentation.TestImport.test_convert_pdf -v
      - name: Verify Kubernetes credential persistence and unique fresh installations
        run: |
          python3 tools/check_k8s_generation.py
      - name: Verify license and documentation
        run: |
          test -s LICENSE && test -s README.md && test -s README.it.md
          test -s docs/GDPR.en.md && test -s docs/GDPR.it.md
          for name in admin-guide user-guide; do for lang in en it; do test -s "docs/manuals/${name}.${lang}.pdf"; done; done
      - name: Detect credential leaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  image-build:
    name: Container build gate
    needs: validate
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@v3
      - name: Build without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: quorivio:gate
      - name: Build dedicated document converter image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.converter
          push: false
          load: true
          tags: quorivio-converter:gate
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: quorivio:gate
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - name: Scan converter image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: quorivio-converter:gate
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
  publish:
    name: Production publication
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs: [validate, image-build]
    runs-on: ubuntu-latest
    environment: production
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify publisher repository
        shell: bash
        run: test "$GITHUB_REPOSITORY" = 'desalvo/quorivio'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Resolve exact image label
        id: label
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            echo 'tag=latest' >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Docker Hub authentication
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish approved image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: desalvo/quorivio:${{ steps.label.outputs.tag }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/desalvo/quorivio
            org.opencontainers.image.licenses=EUPL-1.2
            org.opencontainers.image.revision=${{ github.sha }}

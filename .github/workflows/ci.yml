name: Quorivio CI and Docker Hub
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*', '0.*', '1.*', '2.*']
  workflow_dispatch:
    inputs:
      rc_acceptance_suite:
        description: 'One-click full disposable RC automatic acceptance (all opt-in test gates; NO publishing, NO external hardware or legal sign-off)'
        type: boolean
        default: false
      rc_strict:
        description: 'Fail if any documented RC gate remains unaccepted (manual verification only)'
        type: boolean
        default: false
      publish_image:
        description: 'Explicitly publish a verified multi-architecture image to Docker Hub (never on push/PR/tag automatically)'
        type: boolean
        default: false
      publish_tag:
        description: 'Optional Docker image tag; blank uses sha-<12 characters> or a version git tag'
        type: string
        default: ''
      publish_latest:
        description: 'Also move Docker Hub latest tag (requires publish_image and main ref)'
        type: boolean
        default: false
      browser_test:
        description: 'Run Chromium editor, participant and real PostgreSQL editor UI acceptance (manual opt-in)'
        type: boolean
        default: false
      cross_browser_test:
        description: 'Run independent native Firefox and WebKit focus/geometry CI acceptance (manual opt-in; downloads engines)'
        type: boolean
        default: false
      capacity_test:
        description: 'Run 500-participant disposable PostgreSQL acceptance (manual only)'
        type: boolean
        default: false
      capacity_slo_test:
        description: 'Opt-in 500-participant 90s sustained global p95 join/snapshot latency acceptance on disposable PostgreSQL only'
        type: boolean
        default: false
      kubernetes_manifest_test:
        description: 'API-server dry-run on disposable KIND: NGINX/HAProxy, TLS, RWX, PDB, external/internal database (no runtime/HA certification)'
        type: boolean
        default: false
      kubernetes_runtime_test:
        description: 'Boot two API pods + PostgreSQL 18 on single-node KIND with disposable hostPath RWX; not real multi-node HA/ingress (manual opt-in)'
        type: boolean
        default: false
      kubernetes_multinode_test:
        description: 'Real 2-worker KIND, strict replica placement, ephemeral cross-worker bind, NGINX HTTP ingress and pod recovery (NOT production CSI/HA)' 
        type: boolean
        default: false
      kubernetes_haproxy_test:
        description: 'Real HAProxy Technologies controller on disposable 2-worker KIND with host routing and failover (NOT external CSI/TLS/HA)'
        type: boolean
        default: false
      live_idle_test:
        description: 'Opt-in real PostgreSQL two-replica 70s quiet WebSocket snapshot/freshness acceptance (no production traffic)'
        type: boolean
        default: false
      kubernetes_tls_test:
        description: 'Disposable two-worker KIND true HTTPS ingress via NGINX and HAProxy Technologies, ephemeral TLS, strict SNI, wrong-host and pod recovery (NOT public CA)'
        type: boolean
        default: false
      clamav_runtime_test:
        description: 'Real private ClamAV INSTREAM acceptance with clean + harmless EICAR signature (manual opt-in, no publication)'
        type: boolean
        default: false
      rootless_podman_test:
        description: 'Build and run the real application with rootless Podman and disposable PostgreSQL 18 (manual opt-in; no publishing)'
        type: boolean
        default: false
      runtime_arch_test:
        description: 'Boot amd64 and arm64 images under Docker/QEMU with disposable PostgreSQL 18; not native ARM64, rootless Podman or Kubernetes (manual opt-in)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Production quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Run-scoped, disposable PostgreSQL credential. This is not a production secret.
    env:
      QUORIVIO_CI_DB_PASSWORD: ${{ format('ci-{0}-{1}-{2}', github.run_id, github.run_attempt, github.sha) }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: quorivio
          POSTGRES_USER: quorivio
          POSTGRES_PASSWORD: ${{ format('ci-{0}-{1}-{2}', github.run_id, github.run_attempt, github.sha) }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quorivio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      # Fail before dependency installation / database integration if the
      # cumulative archive has silently dropped an immutable receipt.
      - name: RC166 disposable CI credential policy and GitGuardian preflight
        run: python3 -m unittest tools.tests.test_rc166_ci_credentials -q
      - name: Validate historical RC inventory references early
        run: python3 tools/ci_inventory_reference_guard.py
      - name: Validate RC campaign dispatch isolation before dependencies
        run: python3 -m unittest tools.tests.test_rc_cycle77_dispatch_isolation -q
      - name: Validate RC102 editor and explicit commit CI/publish safety before dependencies
        run: |
          python3 -m unittest tools.tests.test_rc_cycle102_editor_and_commit_markers -q
          python3 -m unittest tools.tests.test_rc103_native_thumbnail_reconciliation -q
      - name: RC230 inventory promotion guard before npm
        run: python3 -m unittest tools.tests.test_rc230_inventory_promotion -q
      - name: RC231 Python import-path verification before npm
        run: python3 -m unittest tools.tests.test_rc231_import_paths -q
      - name: Validate active RC release headers against the current inventory
        run: |
          PYTHONPATH=tools python3 tools/verify_rc_release_status.py
          PYTHONPATH=tools python3 -m unittest tools.tests.test_rc_cycle100_release_status_guard -q
          PYTHONPATH=tools python3 -m unittest tools.tests.test_rc199_release_headers -q
          # Pure-source RC200 assertions; native PowerPoint cases run only after Pillow/pptx installation.
          PYTHONPATH=tools python3 -m unittest tools.tests.test_rc200_editor_portability.RC200EditorPortability -q
          PYTHONPATH=tools python3 -m unittest tools.tests.test_rc202_dependency_staging -q
          PYTHONPATH=tools python3 -m unittest tools.tests.test_rc203_editor_grid_track -q
          PYTHONPATH=tools python3 -m unittest tools.tests.test_rc204_anon_cohort_contract -q
          PYTHONPATH=tools python3 -m unittest tools.tests.test_rc205_editor_consistency -q
          PYTHONPATH=tools python3 -m unittest tools.tests.test_rc201_live_qr_refresh -q
          PYTHONPATH=tools python3 -m unittest tools.tests.test_rc147_inventory_no_cache -q
          PYTHONPATH=tools python3 -m unittest tools.tests.test_rc148_phone_atomic_undo -q
          PYTHONPATH=tools python3 -m unittest tools.tests.test_rc149_background_contracts -q
          PYTHONPATH=tools python3 -m unittest tools.tests.test_rc150_widget_history_types -q
          PYTHONPATH=tools python3 -m unittest tools.tests.test_rc151_strict_types_mutation -q
          # RC155: selected-widget toolbar must not occlude revision-conflict recovery.
          python3 -m unittest tools.tests.test_rc155_conflict_ribbon -q
          # RC156: actual smartphone background routing, per-device canvas identity,
          # and unsaved editor rehearsal; run before npm and expensive integrations.
          python3 -m unittest tools.tests.test_canvas_background_native_context tools.tests.test_editor_page_isolation tools.tests.test_rc_rehearsal_unique_mount_20261028 tools.tests.test_rc156_editor_contracts -q
      # RC157: do not spend minutes on PostgreSQL/browser/K8s before detecting
      # Python import-path failures in the late grouped evidence step.
      - name: RC157 isolated release imports and checksum preflight before npm
        run: |
          env -u PYTHONPATH python3 -m unittest tools.tests.test_rc146_release_header_fix tools.tests.test_rc157_release_import_paths -q
          python3 tools/verify_rc_release_status.py
      - name: RC158 required Chromium media dependencies and manual Docker safety preflight
        run: python3 -m unittest tools.tests.test_rc158_browser_media_bootstrap -q
      - name: RC159 rate-limit, session controls and rating parity preflight before npm
        run: python3 -m unittest tools.tests.test_rc159_presenter_controls -q
      - name: RC159 live participant 16:9 and presenter title parity preflight before npm
        run: python3 -m unittest tools.tests.test_rc159_live_preview_parity -q
      - name: RC160 participant widget-only rendering, rating comment and footer preflight
        run: python3 -m unittest tools.tests.test_rc160_participant_widget_ownership -q
      # RC195: RC161 must verify the resolved master default and authored font
      # overrides rather than expecting an obsolete inline main.tsx literal.
      # RC196: cover the source question import and the editor's persisted
      # showSourceQuestion field before the slow front-end build.
      # RC197: the 2,024-case Kubernetes Python megasuite previously failed at
      # six stale source-string checks on the independent presenter/audience
      # pages, typed subquestion description and centralized typography.
      # Run all six exact historic test modules early, keeping their behavioral
      # assertions, without requiring Docker/PostgreSQL/Chromium.
      - name: RC197 reconcile Kubernetes Python integration contracts before npm
        run: |
          python3 -m unittest -q \
            tools.tests.test_rc197_kubernetes_python_reconciliation \
            tools.tests.test_page_rename_preview_contract_20261027 \
            tools.tests.test_rc143_phone_result_ribbon \
            tools.tests.test_rc75_typescript_ci \
            tools.tests.test_rc_presenter_linked_preview_20261028 \
            tools.tests.test_rehearsal_send_parity_20261028 \
            tools.tests.test_visual_parity_rehearsal_20261028
      # RC255: the RC75 strict standalone tsc invocation must include
      # --allowImportingTsExtensions with --noEmit. The slide-master's native
      # Node ESM import intentionally ends in .ts; Vite alone did not expose
      # the TS5097 error that made RC254 full CI fail before npm.
      - name: RC255 strict standalone TypeScript and Node ESM compatibility before npm
        run: python3 -m unittest tools.tests.test_rc255_standalone_typescript_ci -q
      # RC210: RC206 moved thumbnail rename behind the selection-aware batch
      # handler. Keep the historical UI contract aligned and fail early if
      # the title-only authorized path is disconnected.
      - name: RC210 selection-aware thumbnail rename contract before npm
        run: python3 -m unittest tools.tests.test_rc210_thumbnail_rename_ci -q
      # RC213: the RC206 thumbnail keyboard effect had a TS2448/TS2454
      # temporal-dead-zone read in its dependency array. Guard hook order
      # before npm and retain the strict real TypeScript compile later.
      - name: RC213 React page order state initialization before npm
        run: python3 -m unittest tools.tests.test_rc213_page_order_state_ci -q
      # RC214: RC106/keyboard historic inline-click assertions predate RC206
      # Ctrl/Cmd multi-selection. Run both suites early and verify Escape focus.
      - name: RC214 thumbnail multi-selection and Escape focus contracts before npm
        run: |
          python3 -m unittest -q \
            tools.tests.test_rc214_thumbnail_selection_ci \
            tools.tests.test_editor_contextual_layout_v2 \
            tools.tests.test_editor_thumbnail_keyboard_rc \
            tools.tests.test_page_editor_followup
      # RC218: RC206 selection-aware thumbnail menus include a shortcut suffix
      # and optionally a plural label. Guard the real PostgreSQL Chromium
      # selector and persisted title-only rename before installing npm.
      # RC219: the 2,115-case discovery also loads tests as bare modules,
      # unlike the dotted module preflights. Check both import contexts and
      # reconciled unsaved navigation, shared footer typography and answer
      # underline/strike before expensive Chromium/PostgreSQL/Kubernetes.
      - name: RC219 Python discovery import and historical UI contracts before npm
        run: |
          python3 -m unittest tools.tests.test_rc219_full_discovery_contract -q
          for case in \
            test_editor_contextual_layout_v2.py \
            test_editor_thumbnail_keyboard_rc.py \
            test_page_editor_unsaved_guard.py \
            test_rc142_editor_clipboard_mobile_footer.py \
            test_rc_cycle198_answer_decorations.py; do
            PYTHONPATH=tools python3 -m unittest discover -s tools/tests -p "$case" -q
          done
      # RC275: RC274 truth-result toggle must keep source-question styling
      # on the same shared chart in live, editor and simulated views.
      - name: RC275 linked-result source and truth toggle regression before npm
        run: |
          python3 -m unittest tools.tests.test_rc275_source_renderer_contract tools.tests.test_rc192_source_and_delete tools.tests.test_rc196_frontend_results_types -q
      # RC276: the live cross-page presenter uses the R toggle owned by the
      # common LinkedResultChart. Detect stale live-only contracts early.
      - name: RC277 bilingual manual publication and workflow documentation
        run: python3 -m unittest tools.tests.test_rc277_manuals -q
      - name: RC278 manual identity, real screenshot provenance and CI capture contracts
        run: python3 -m unittest tools.tests.test_rc278_manual_screenshots -q
      - name: RC279 OAuth HA documentation and legacy manual contracts preflight
        run: python3 -m unittest tools.tests.test_rc279_oauth_ha_manual tools.tests.test_rc154_load_gravatar -q
      - name: RC276 presenter cross-page R toggle consistency before npm
        run: |
          python3 -m unittest tools.tests.test_rc191_crosspage_live_rehearsal tools.tests.test_rc275_source_renderer_contract -q
          node --experimental-strip-types --test \
            apps/web/test/rc191-cross-page-preview.test.ts \
            apps/web/test/rc276-live-truth-toggle.test.ts \
            apps/web/test/rc274-answer-truth.test.ts
      # RC220: catch missing private converter prerequisites and linked-results
      # schema/visual contract drift before npm and browser integration.
      - name: RC220 PDF worker administration and linked result rendering before npm
        run: |
          python3 -m unittest tools.tests.test_rc220_converter_and_linked_results tools.tests.test_rc192_source_and_delete tools.tests.test_rc196_frontend_results_types -q
          node --experimental-strip-types --test \
            apps/api/test/converter-admission.test.ts \
            apps/api/test/rc220-results-configuration.test.ts \
            apps/web/test/rc220-source-sections.test.ts
      # RC221: validate PDF editable/import-as-image choice, bounded private
      # Poppler worker, author-only truth overlay and independently saved styles.
      - name: RC221 PDF editable choices and per-result grading formatting before npm
        run: |
          python3 -m unittest tools.tests.test_rc221_pdf_editable_and_results -q
          node --experimental-strip-types --test \
            apps/api/test/rc221-results-validation.test.ts \
            apps/web/test/rc221-results-format.test.ts
      # RC222: prevent stale editor-only nowrap/Arial bugs and tall formatting bars
      # before npm, real Chromium then covers both 1440px and mobile widths.
      - name: RC222 compact formatting and answer-option typography before npm
        run: |
          python3 -m unittest tools.tests.test_rc222_compact_editor_answers tools.tests.test_rc205_editor_consistency -q
          node --experimental-strip-types --test \
            apps/web/test/rc222-editor-compact-answer-format.test.ts \
            apps/web/test/rc193-font-focus.test.ts
      # RC223: format opens only from the widget context menu; border/effects,
      # content visibility and linked-source tabs must keep verified contracts.
      - name: RC223 contextual formatter and responsive widget layout before npm
        run: |
          python3 -m unittest tools.tests.test_rc223_format_layout tools.tests.test_rc222_compact_editor_answers -q
          node --experimental-strip-types --test apps/web/test/rc223-format-footer-qr.test.ts
      # RC224: all page/scheme widget defaults Arial, no clipped thumbnail actions.
      - name: RC224 viewport-safe thumbnail menu and Arial defaults before npm
        run: |
          python3 -m unittest tools.tests.test_rc224_thumbnail_arials -q
          node --experimental-strip-types --test apps/web/test/rc224-thumbnail-menu-arial.test.ts
      # RC229: run source-only UI/worker contracts before npm. The native PDF/PPTX
      # conversion boundary suite requires Poppler, LibreOffice and ReportLab;
      # RC232 runs it AFTER those OS/Python packages are provisioned.
      - name: RC229 consolidated legacy UI and converter preflight before npm
        run: |
          python3 -m unittest -q tools.tests.test_rc229_historical_ci_consolidation \
            tools.tests.test_editor_draft_import \
            tools.tests.test_rc110_background_cloud_answer \
            tools.tests.test_rc137_presenter_privacy_background \
            tools.tests.test_rc144_mobile_rating \
            tools.tests.test_rc162_mobile_qr_contracts \
            tools.tests.test_rc_cycle89_editor_feedback
      # RC232: prevent runtime PDF/PPTX conversion acceptance from running
      # before its native and Python dependencies are installed on fresh runners.
      - name: RC233 frontend linked-results TypeScript contract before npm
        run: python3 -m unittest tools.tests.test_rc233_editor_results_type_contract -q
      - name: RC232 conversion test provisioning order preflight before npm
        run: python3 -m unittest tools.tests.test_rc232_conversion_ci_order -q
      # RC228: the historical RC225 gallery test must accept RC227's portaled
      # accessible scheme dialog, without weakening its modal and selection checks.
      - name: RC228 historical modal-gallery CI contract before npm
        run: python3 -m unittest tools.tests.test_rc228_ci_gallery_contract tools.tests.test_rc225_asset_library_and_scheme -q
      # RC225: surface filenames, refuse accidental overwrites and render image thumbnails.
      - name: RC225 asset filenames, delete recovery and schema background before npm
        run: |
          python3 -m unittest tools.tests.test_rc225_asset_library_and_scheme -q
          node --experimental-strip-types --test apps/api/test/file-display-names.test.ts
      # RC226: master ribbon icon/caption parity, mobile presenter studio and
      # automatic participant phone layout must be checked before npm.
      - name: RC226 responsive presenter and master editor contracts before npm
        run: |
          python3 -m unittest tools.tests.test_rc226_master_mobile_ui tools.tests.test_rc224_thumbnail_arials -q
          node --experimental-strip-types --test apps/web/test/rc226-participant-device.test.ts
      # RC235: historical RC226 viewport fixture must follow the accepted RC234
      # vertically wrapped palette while retaining horizontal page thumbnails.
      - name: RC235 responsive studio palette compatibility before npm
        run: python3 -m unittest tools.tests.test_rc235_responsive_browser_compat -q
      # RC236: the thumbnail menu now uses native disclosure sections, so
      # authenticated Chromium/PostgreSQL tests must expand the real summary.
      - name: RC236 page thumbnail browser disclosure compatibility before npm
        run: python3 -m unittest tools.tests.test_rc236_page_menu_disclosures -q
      # RC274: inline answer correctness and reproducible dependency preflight.
      - name: RC274 answer truth, privacy and npm lockfile regression before npm
        run: |
          node --experimental-strip-types --test apps/web/test/rc274-answer-truth.test.ts
          python3 -m unittest tools.tests.test_rc274_ci_integrity -q
      # RC270: backup archive, audit and LDAP approval, including wizard mount
      # checks; keep these tests in CI so new functionality cannot regress.
      - name: RC270 full backup, LDAP audit, and Kubernetes wizard before npm
        run: |
          node --experimental-strip-types --test apps/api/test/rc270-backup-audit.test.ts
          python3 -m unittest tools.test_rc270_wizard_backup -q
      # RC271: guard against stale current-inventory promotion of RC270 docs.
      - name: RC271 metadata and current inventory promotion before npm
        run: python3 -m unittest tools.tests.test_rc271_release_promotion -q
      # RC269: auth redirect, ownership transfer, LDAP TLS, ephemeral space
      # reclamation and right-click-only sidebar before npm dependencies.
      - name: RC269 auth LDAP ownership housekeeping and sidebar before npm
        run: |
          node --experimental-strip-types --test apps/api/test/rc269-ldap-housekeeping.test.ts apps/web/test/rc269-auth-sidebar-ownership.test.ts
          python3 -m unittest tools.tests.test_rc269_ldap_housekeeping_wizard -q
      # RC268: exercise the current preview/sidebar contracts and page-specific
      # participant phone 16:9 policy before installing npm dependencies.
      - name: RC268 editor preview and static participant phone view before npm
        run: node --experimental-strip-types --test apps/web/test/rc268-preview-sidebar-mobile.test.ts
      # RC267: run the actual early CI shell script in a dependency-free runner
      # so dropped line continuations cannot execute .test.ts files as commands.
      - name: RC267 early Node test runner invocation contract before npm
        run: python3 -m unittest tools.tests.test_rc267_ci_node_preflight_invocation -q
      # RC266: guard the correct participant canvas background composition before
      # reaching historical RC227, including inherited scheme suppression.
      - name: RC266 participant stage background and legacy assertion compatibility before npm
        run: |
          node --experimental-strip-types --test \
            apps/web/test/rc173-public-slide-fidelity.test.ts \
            apps/web/test/rc266-participant-background-legacy-contract.test.ts \
            apps/web/test/rc266-floating-window-docking.test.ts
      # RC227: accessible compact master background chooser and responsive
      # participant rotation, preserving explicit manual screen mode selection.
      - name: RC227 schema backgrounds and mobile participant mode before npm
        run: |
          python3 -m unittest tools.tests.test_rc227_background_phone tools.tests.test_rc226_master_mobile_ui -q
          node --experimental-strip-types --test apps/web/test/rc227-scheme-background-and-phone.test.ts apps/web/test/rc173-public-slide-fidelity.test.ts
      # RC237: exact rename locator guard rejects export_actions substring
      # aliases while retaining the original PostgreSQL/Chromium checks.
      - name: RC237 rename versus export action scope regression before npm
        run: python3 -m unittest tools.tests.test_rc237_rename_scope_guard -q
      # RC238: RC227 auto-selects smartphone for touch/narrow participants.
      # Join, reload and faithful 16:9 cross-device comparisons must agree.
      - name: RC238 participant auto-phone and faithful-slide Chromium contract before npm
        run: python3 -m unittest tools.tests.test_rc238_auto_phone_participant_chromium -q
      # RC239: RC223 exposes format scope and font controls only after the
      # explicit widget context-menu action, not inside the inspector drawer.
      - name: RC239 real editor focus and explicit formatter lifecycle before npm
        run: python3 -m unittest tools.tests.test_rc239_editor_format_lifecycle -q
      - name: RC240 verified full CI ledger and private evidence intake safety before npm
        run: python3 -m unittest tools.tests.test_rc240_ci_operator_evidence -q
      - name: RC241 results, smartphone preview, toolbar and editable numeric format preflight
        run: |
          python3 -m unittest tools.tests.test_rc241_widget_editor_contract -q
          node --experimental-strip-types --test apps/web/test/rc241-editable-widget-numbers.test.ts apps/web/test/rc241-ui-feature-contract.test.ts
      # RC256: historical Arial fixtures must track the validated font allowlist,
      # not the obsolete raw style?.fontFamily||'Arial' source literal. Run all
      # previous font gates AND runtime Node CSS serialization before RC242/195.
      - name: RC256 reconciled historical Arial widget and master tests before npm
        run: |
          python3 -m unittest -q \
            tools.tests.test_rc256_historical_arial_compat \
            tools.tests.test_rc242_arial_master_zoom \
            tools.tests.test_rc194_question_typography \
            tools.tests.test_rc195_master_typography_ci \
            tools.tests.test_rc161_master_background_graphics \
            tools.tests.test_rc145_mobile_background_font
          node --experimental-strip-types --test apps/web/test/rc254-all-widget-schema-fonts.test.ts
      # RC257: RC256 missed the RC193 fixture that asserted an unsafe raw
      # fontFamily fallback. Run the entire legacy font contract and a scan of
      # future source-literal assertions early, before the older RC193 step.
      - name: RC257 all historical Arial text fallback guards before npm
        run: |
          python3 -m unittest -q tools.tests.test_rc257_full_arial_preflight tools.tests.test_rc193_focus_and_font
          node --experimental-strip-types --test apps/web/test/rc254-all-widget-schema-fonts.test.ts
      # RC258: k8s_wizard.py is a single file: its embedded inspection and
      # converter upgrade libraries must match the canonical stdlib sources.
      # Check real standalone subprocesses with fake kubectl, rollout default
      # maxUnavailable 25% rounding, and no cross-resource mutations.
      - name: RC258 standalone Kubernetes wizard and safe converter rollout before npm
        run: python3 -m unittest tools.tests.test_rc258_standalone_wizard_rollout -q
      # RC259: the complete Python suite found a stale PPTX projection source-
      # literal assertion after the RC258 wizard tests. Check the secure
      # font serializer and standalone GitHub updater before expensive gates.
      - name: RC259 PPTX projection font and standalone wizard self-update before npm
        run: |
          python3 -m unittest -q \
            tools.tests.test_pptx_projection_text_fidelity \
            tools.tests.test_rc259_wizard_self_update \
            tools.tests.test_rc258_standalone_wizard_rollout \
            tools.tests.test_k8s_ha_hardening
          node --experimental-strip-types --test apps/web/test/rc254-all-widget-schema-fonts.test.ts
      # RC260: original generated manifests and live converter must remain
      # consistent across token provisioning, successful rollout and later
      # regeneration. Validate path drift, private backups and standalone sync.
      - name: RC260 generated Kubernetes manifest reconciliation before npm
        run: |
          python3 -m unittest -q \
            tools.tests.test_rc260_generated_manifest_reconciliation \
            tools.tests.test_rc246_converter_upgrade \
            tools.tests.test_rc258_standalone_wizard_rollout
      # RC265: imported full-bleed PDF/PPTX pages must use private canvas backgrounds,
      # preserve three explicit fit modes, suppress inherited overlay by default,
      # and render real thumbnails on all stages without an npm install.
      - name: RC265 PDF image full-canvas and thumbnail acceptance before npm
        run: |
          node --experimental-strip-types --test \
            apps/web/test/rc265-image-import-full-bleed.test.ts \
            apps/api/test/rc265-image-import-full-bleed.test.ts
      # RC264: synthetic cross-filesystem renderer tests also need to mock
      # PNG decoding in the pre-npm runner, which intentionally has no Pillow.
      # Production _verify_png must continue to fail closed without Pillow.
      - name: RC264 Pillow-independent simulated PDF early CI gate
        run: |
          python3 -m unittest -q \
            tools.tests.test_rc264_pillow_independent_ci \
            tools.tests.test_rc261_conversion_mount_and_zlib \
            tools.tests.test_rc263_kube_defaults_and_ci
      # RC263: the PDF regression uses a synthetic subprocess runner and must
      # not require Poppler on GitHub's early runner; Kubernetes adds harmless
      # terminationMessage* defaults to StatefulSet containers post-apply.

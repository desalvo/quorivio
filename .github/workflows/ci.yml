          smtp_password="$(openssl rand -hex 32)"
          admin_password="$(openssl rand -hex 24)"
          changed_password="$(openssl rand -hex 24)"
          auth_secret="$(openssl rand -hex 32)"
          for value in "$load_token" "$smtp_password" "$admin_password" "$changed_password" "$auth_secret"; do
            echo "::add-mask::$value"
          done
          echo "QUORIVIO_CI_LOAD_TOKEN=$load_token" >> "$GITHUB_ENV"
          echo "QUORIVIO_CI_SMTP_PASSWORD=$smtp_password" >> "$GITHUB_ENV"
          echo "QUORIVIO_CI_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          echo "QUORIVIO_CI_NEW_PASSWORD=$changed_password" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$auth_secret" >> "$GITHUB_ENV"
      - name: Start disposable loopback SMTPS for real email MFA acceptance
        shell: bash
        run: |
          mkdir -p /tmp/quorivio-ci-smtps
          chmod 700 /tmp/quorivio-ci-smtps
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -keyout /tmp/quorivio-ci-smtps/key.pem -out /tmp/quorivio-ci-smtps/cert.pem \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' >/dev/null 2>&1
          chmod 600 /tmp/quorivio-ci-smtps/key.pem /tmp/quorivio-ci-smtps/cert.pem
          QUORIVIO_CI_SMTP_PASSWORD="$QUORIVIO_CI_SMTP_PASSWORD" \
          QUORIVIO_CI_SMTP_TEST=1 \
          QUORIVIO_CI_SMTP_CERT=/tmp/quorivio-ci-smtps/cert.pem \
          QUORIVIO_CI_SMTP_KEY=/tmp/quorivio-ci-smtps/key.pem \
          QUORIVIO_CI_SMTP_CAPTURE=/tmp/quorivio-ci-smtps/mail.jsonl \
            python3 tools/ci_smtps_capture.py > /tmp/quorivio-ci-smtps/daemon.log 2>&1 &
          echo $! > /tmp/quorivio-ci-smtps/pid
          for i in $(seq 1 30); do
            if test -f /tmp/quorivio-ci-smtps/mail.jsonl && bash -c 'echo >/dev/tcp/127.0.0.1/2465' 2>/dev/null; then break; fi
            if ! kill -0 "$(cat /tmp/quorivio-ci-smtps/pid)" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          bash -c 'echo >/dev/tcp/127.0.0.1/2465'

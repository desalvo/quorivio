    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Prepare isolated two-worker-only host bind
        run: |
          test "$(id -u)" -ne 0
          sudo install -d -m 0777 /tmp/quorivio-kind-multinode-shared
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: quorivio-multinode
          version: v0.26.0
          config: tools/ci_kind_multinode.yaml
          wait: 120s
      - name: Build and load local unpublished Quorivio image
        run: |
          docker build -t quorivio:kind-multinode .
          kind load docker-image quorivio:kind-multinode --name quorivio-multinode
      - name: Exercise real TLS/SNI, invalid-host refusal and pod replacement over HTTPS
        timeout-minutes: 20
        run: python3 tools/ci_k8s_multinode_ingress_smoke.py --controller '${{ matrix.controller }}' --tls
      - name: Bounded status-only diagnostics (no Secrets, keys or pod logs)
        if: failure()
        run: |
          kubectl -n quorivio-multinode get pods,deploy,sts,pvc,ingress -o wide || true
          kubectl get ingressclass || true
      - name: Clean disposable bind mount
        if: always()
        run: sudo rm -rf /tmp/quorivio-kind-multinode-shared

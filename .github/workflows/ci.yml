name: Quorivio CI and Docker Hub
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*', '0.*', '1.*', '2.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Production quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Install reproducibly
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Compile frontend and backend
        run: npm run build
      - name: Vulnerability gate (high and critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Kubernetes wizard validation
        run: python3 -m unittest discover -s tools/tests -v
      - name: Ensure generated Kubernetes config is deterministic
        run: |
          python3 tools/k8s_wizard.py --unattended --output /tmp/q-a --set host=quorivio.example.org
          python3 tools/k8s_wizard.py --unattended --output /tmp/q-b --set host=quorivio.example.org
          diff -ru /tmp/q-a /tmp/q-b
      - name: Verify license and documentation
        run: |
          test -s LICENSE && test -s README.md && test -s README.it.md
          test -s docs/GDPR.en.md && test -s docs/GDPR.it.md
          for name in admin-guide user-guide; do for lang in en it; do test -s "docs/manuals/${name}.${lang}.pdf"; done; done
      - name: Detect credential leaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  image-build:
    name: Container build gate
    needs: validate
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@v3
      - name: Build without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: quorivio:gate
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: quorivio:gate
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
  publish:
    name: Production publication
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs: [validate, image-build]
    runs-on: ubuntu-latest
    environment: production
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify publisher repository
        shell: bash
        run: test "$GITHUB_REPOSITORY" = 'desalvo/quorivio'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Resolve exact image label
        id: label
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            echo 'tag=latest' >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Docker Hub authentication
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish approved image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: desalvo/quorivio:${{ steps.label.outputs.tag }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/desalvo/quorivio
            org.opencontainers.image.licenses=EUPL-1.2
            org.opencontainers.image.revision=${{ github.sha }}

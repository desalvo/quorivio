name: Quorivio CI and Docker Hub
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*', '0.*', '1.*', '2.*']
  workflow_dispatch:
    inputs:
      rc_strict:
        description: 'Fail if any documented RC gate remains unaccepted (manual verification only)'
        type: boolean
        default: false
      publish_image:
        description: 'Explicitly publish a verified multi-architecture image to Docker Hub (never on push/PR/tag automatically)'
        type: boolean
        default: false
      publish_tag:
        description: 'Optional Docker image tag; blank uses sha-<12 characters> or a version git tag'
        type: string
        default: ''
      publish_latest:
        description: 'Also move Docker Hub latest tag (requires publish_image and main ref)'
        type: boolean
        default: false
      browser_test:
        description: 'Run Chromium editor, participant and real PostgreSQL editor UI acceptance (manual opt-in)'
        type: boolean
        default: false
      cross_browser_test:
        description: 'Run independent native Firefox and WebKit focus/geometry CI acceptance (manual opt-in; downloads engines)'
        type: boolean
        default: false
      capacity_test:
        description: 'Run 500-participant disposable PostgreSQL acceptance (manual only)'
        type: boolean
        default: false
      kubernetes_manifest_test:
        description: 'API-server dry-run on disposable KIND: NGINX/HAProxy, TLS, RWX, PDB, external/internal database (no runtime/HA certification)'
        type: boolean
        default: false
      kubernetes_runtime_test:
        description: 'Boot two API pods + PostgreSQL 18 on single-node KIND with disposable hostPath RWX; not real multi-node HA/ingress (manual opt-in)'
        type: boolean
        default: false
      runtime_arch_test:
        description: 'Boot amd64 and arm64 images under Docker/QEMU with disposable PostgreSQL 18; not native ARM64, rootless Podman or Kubernetes (manual opt-in)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Production quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: quorivio
          POSTGRES_USER: quorivio
          POSTGRES_PASSWORD: ci-only-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quorivio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'} # npm caching requires a committed package-lock.json
      - name: Install reproducibly
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Publish evidence-based RC readiness diagnostics (non-blocking)
        run: python3 tools/rc_release_preflight.py --output /tmp/quorivio-rc-readiness.json
      - name: Publish RC gate summary in GitHub Actions
        if: success()
        run: python3 tools/ci_rc_gate_summary.py /tmp/quorivio-rc-readiness.json
      - name: Strict release-candidate gate (manual opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.rc_strict
        run: python3 tools/rc_release_preflight.py --strict
      - name: Unit tests
        run: npm test
      - name: Editor autosave recovery and shared geometry unit tests
        run: node --experimental-strip-types --test apps/web/test/*.test.ts
      - name: Compile frontend and backend
        run: npm run build
      - name: Chromium editor UI acceptance (opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.browser_test
        timeout-minutes: 8
        run: |
          python3 -m pip install --disable-pip-version-check --break-system-packages 'playwright>=1.50,<2'
          # GitHub-hosted ubuntu-24.04 already has Chrome/Chromium. Avoid apt
          # mirror stalls from installing system packages (CI 40395950707).
          # Smoke and export the exact browser used by every subsequent UI test.
          python3 tools/ci_browser_bootstrap.py --smoke --github-env "$GITHUB_ENV"
          export QUORIVIO_CHROMIUM_PATH="$(sed -n 's/^QUORIVIO_CHROMIUM_PATH=//p' "$GITHUB_ENV" | tail -1)"
          npm run dev:web > /tmp/quorivio-ci-vite.log 2>&1 &
          echo $! > /tmp/quorivio-ci-vite.pid
          trap 'kill $(cat /tmp/quorivio-ci-vite.pid) || true; tail -80 /tmp/quorivio-ci-vite.log' EXIT
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --show-error http://127.0.0.1:5173/
          # Real browser CSS preflight: catch hidden nested actions before UI acceptance.
          python3 tools/ci_nested_context_css_chromium.py
          python3 tools/ci_accessible_disclosure_chromium.py
          # Fail fast on accessible-name ambiguity introduced by icon-only Save.
          python3 tools/ci_editor_save_locator_chromium.py
          # Actual editor geometry: expanded keyboard/touch controls must not cover Save.
          python3 tools/ci_editor_save_flow_chromium.py
          python3 tools/ci_editor_mock_layout_chromium.py
          # Regression: a fixed mock header may cover the 7px canvas corner after scrolling.
          python3 tools/ci_canvas_context_hit_target_chromium.py
          # Real Chromium regression: header must not intercept canvas context
          # or selection/layer controls (full run 40589103128).
          python3 tools/ci_editor_context_header_overlay_chromium.py
          # Geometric parity across editor, rehearsal and audience at 1440px / 390px.
          python3 tools/ci_widget_visual_geometry_20261028.py
          # Dual presenter/participant preview must preserve 16:9 and real reaction hit targets.
          python3 tools/ci_preview_layout_offline.py
          # Actual TS keyboard module: modal focus trap, Escape and scroll cleanup, 1440/390px.
          python3 tools/ci_rehearsal_keyboard_chromium.py
          # Same production module and page geometry as the opt-in native Firefox/WebKit job.
          python3 tools/ci_cross_browser_rc.py --engines chromium
          # Real preview response-state module: draft vs send, same-page reaction lock, reset.
          python3 tools/ci_rehearsal_submission_chromium.py
          python3 tools/ci_rehearsal_timer_chromium.py
          # Real production React WYSIWYG component, caret/selection and live styles.
          python3 tools/ci_browser_rich_text_offline.py
          # Real bundled React without HTTP: exactly one accessible rehearsal
          # from both dashboard and editor (regression for CI 40689633215).
          # Public participant 16:9 stage and an accessible linear-reading alternative.
          python3 tools/ci_rc_public_stage_chromium.py
          # The real TS rehearsal handler also isolates portals created after opening.
          python3 tools/ci_rc_rehearsal_dynamic_portals_chromium.py
          python3 tools/ci_rehearsal_singleton_offline_chromium.py
          # Real built React: one-time account recovery bearer never lingers in URL/history.
          python3 tools/ci_recovery_url_chromium.py
          python3 tools/ci_browser_editor.py
      - name: Upload Chromium failure diagnostics
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.browser_test
        uses: actions/upload-artifact@v4
        with:
          name: chromium-editor-failure
          path: /tmp/quorivio-browser-artifacts/
          if-no-files-found: ignore
          retention-days: 3
      - name: Install PostgreSQL 18 client for integration and disaster recovery
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo '/usr/lib/postgresql/18/bin' >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version | grep -Eq '^pg_dump \(PostgreSQL\) 18\.'
          /usr/lib/postgresql/18/bin/pg_restore --version | grep -Eq '^pg_restore \(PostgreSQL\) 18\.'
      - name: Generate ephemeral CI load and SMTP credentials
        run: |
          load_token="$(openssl rand -hex 32)"
          smtp_password="$(openssl rand -hex 32)"
          echo "::add-mask::$load_token"
          echo "::add-mask::$smtp_password"
          echo "QUORIVIO_CI_LOAD_TOKEN=$load_token" >> "$GITHUB_ENV"
          echo "QUORIVIO_CI_SMTP_PASSWORD=$smtp_password" >> "$GITHUB_ENV"
      - name: Start disposable loopback SMTPS for real email MFA acceptance
        shell: bash
        run: |
          mkdir -p /tmp/quorivio-ci-smtps
          chmod 700 /tmp/quorivio-ci-smtps
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -keyout /tmp/quorivio-ci-smtps/key.pem -out /tmp/quorivio-ci-smtps/cert.pem \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' >/dev/null 2>&1
          chmod 600 /tmp/quorivio-ci-smtps/key.pem /tmp/quorivio-ci-smtps/cert.pem
          QUORIVIO_CI_SMTP_PASSWORD="$QUORIVIO_CI_SMTP_PASSWORD" \
          QUORIVIO_CI_SMTP_TEST=1 \
          QUORIVIO_CI_SMTP_CERT=/tmp/quorivio-ci-smtps/cert.pem \
          QUORIVIO_CI_SMTP_KEY=/tmp/quorivio-ci-smtps/key.pem \
          QUORIVIO_CI_SMTP_CAPTURE=/tmp/quorivio-ci-smtps/mail.jsonl \
            python3 tools/ci_smtps_capture.py > /tmp/quorivio-ci-smtps/daemon.log 2>&1 &
          echo $! > /tmp/quorivio-ci-smtps/pid
          for i in $(seq 1 30); do
            if test -f /tmp/quorivio-ci-smtps/mail.jsonl && bash -c 'echo >/dev/tcp/127.0.0.1/2465' 2>/dev/null; then break; fi
            if ! kill -0 "$(cat /tmp/quorivio-ci-smtps/pid)" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          bash -c 'echo >/dev/tcp/127.0.0.1/2465'
      - name: Start API against real PostgreSQL
        env:
          DATABASE_URL: postgres://quorivio:ci-only-secret@127.0.0.1:5432/quorivio
          AUTH_SECRET: ci-only-integration-secret-must-be-long-enough-123
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: ci-only-administrator-password-123
          PUBLIC_BASE_URL: http://127.0.0.1:8080
          PORT: '8080'
          QUORIVIO_ASSET_DIR: /tmp/quorivio-ci-assets
          QUORIVIO_CONVERSION_DIR: /tmp/quorivio-ci-conversions
          LOAD_TEST_TOKEN: ${{ env.QUORIVIO_CI_LOAD_TOKEN }}
          NODE_EXTRA_CA_CERTS: /tmp/quorivio-ci-smtps/cert.pem
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: '2465'
          SMTP_SECURE: 'true'
          SMTP_USER: ci-smtp-user
          SMTP_PASSWORD: ${{ env.QUORIVIO_CI_SMTP_PASSWORD }}
          SMTP_FROM: ci-sender@example.invalid
        run: |
          node apps/api/dist/server.js > /tmp/quorivio-ci-api.log 2>&1 &
          echo $! > /tmp/quorivio-ci-api.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/health/ready >/dev/null; then break; fi
            if ! kill -0 $(cat /tmp/quorivio-ci-api.pid) 2>/dev/null; then cat /tmp/quorivio-ci-api.log; exit 1; fi
            sleep 1
          done
          curl --fail --show-error http://127.0.0.1:8080/api/health/ready
          curl --fail --show-error http://127.0.0.1:8080/api/health/live
          curl --fail --show-error http://127.0.0.1:8080/ > /tmp/quorivio-ci-home.html
          grep -qi 'html' /tmp/quorivio-ci-home.html
      - name: Assert database bootstrapping and baseline auth
        env:
          PGPASSWORD: ci-only-secret
        run: |
          test "$(psql -h 127.0.0.1 -U quorivio -d quorivio -Atc 'SELECT count(*) FROM users')" = '1'
          test "$(psql -h 127.0.0.1 -U quorivio -d quorivio -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('auth_flows','api_rate_windows','widget_answers')")" = '3'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/auth/me)" = '401'
      - name: PostgreSQL-backed portable and profile lifecycle E2E
        env:
          QUORIVIO_CI_ADMIN_EMAIL: admin@example.com
          QUORIVIO_CI_ADMIN_PASSWORD: ci-only-administrator-password-123
          QUORIVIO_CI_NEW_PASSWORD: ci-only-changed-admin-password-123
        run: python3 tools/ci_portable_http.py
      - name: PostgreSQL and real TLS SMTP email MFA lifecycle acceptance
        env:
          # This shared, disposable test IP exceeds 100 requests/min across suites.
          # The server accepts the token only when NODE_ENV is not production.
          QUORIVIO_CI_LOAD_TOKEN: ${{ env.QUORIVIO_CI_LOAD_TOKEN }}
          DATABASE_URL: postgres://quorivio:ci-only-secret@127.0.0.1:5432/quorivio
          QUORIVIO_CI_MFA_TEST: '1'
          QUORIVIO_CI_ADMIN_EMAIL: admin@example.com
          QUORIVIO_CI_NEW_PASSWORD: ci-only-changed-admin-password-123
          QUORIVIO_CI_SMTP_CAPTURE: /tmp/quorivio-ci-smtps/mail.jsonl
        run: python3 tools/ci_email_mfa_postgres.py
      - name: PostgreSQL TLS SMTP password recovery and session revocation acceptance
        env:
          QUORIVIO_CI_RECOVERY_TEST: '1'
          QUORIVIO_CI_LOAD_TOKEN: ${{ env.QUORIVIO_CI_LOAD_TOKEN }}
          DATABASE_URL: postgres://quorivio:ci-only-secret@127.0.0.1:5432/quorivio
          QUORIVIO_CI_SMTP_CAPTURE: /tmp/quorivio-ci-smtps/mail.jsonl
          QUORIVIO_CI_ADMIN_EMAIL: admin@example.com
          QUORIVIO_CI_NEW_PASSWORD: ci-only-changed-admin-password-123
        run: python3 tools/ci_password_recovery_postgres.py
      - name: PostgreSQL session retention and durable erasure outbox acceptance
        env:
          DATABASE_URL: postgres://quorivio:ci-only-secret@127.0.0.1:5432/quorivio
          QUORIVIO_CI_RETENTION_TEST: '1'
        run: node tools/ci_retention_postgres.mjs
      - name: PostgreSQL-backed concurrent live lifecycle E2E
        env:
          QUORIVIO_CI_LOAD_TOKEN: ${{ env.QUORIVIO_CI_LOAD_TOKEN }}
          QUORIVIO_CI_ADMIN_EMAIL: admin@example.com
          QUORIVIO_CI_NEW_PASSWORD: ci-only-changed-admin-password-123
        run: python3 tools/ci_live_http.py
      - name: PostgreSQL audience Q&A concurrency, moderation, privacy and pagination
        env:
          QUORIVIO_CI_ADMIN_EMAIL: admin@example.com
          QUORIVIO_CI_NEW_PASSWORD: ci-only-changed-admin-password-123
          QUORIVIO_CI_MODERATION_TEST: '1'
          QUORIVIO_CI_LOAD_TOKEN: ${{ env.QUORIVIO_CI_LOAD_TOKEN }}
        run: python3 tools/ci_audience_moderation_postgres.py
      - name: PostgreSQL timed-widget fairness, retry and topic concurrency acceptance
        env:
          QUORIVIO_CI_ADMIN_EMAIL: admin@example.com
          QUORIVIO_CI_NEW_PASSWORD: ci-only-changed-admin-password-123
          QUORIVIO_CI_TIMED_TEST: '1'
          DATABASE_URL: postgres://quorivio:ci-only-secret@127.0.0.1:5432/quorivio
        run: python3 tools/ci_timed_widgets_postgres.py

      - name: PostgreSQL editor concurrent authoring and conflict E2E
        env:
          QUORIVIO_CI_LOAD_TOKEN: ${{ env.QUORIVIO_CI_LOAD_TOKEN }}
          QUORIVIO_CI_ADMIN_EMAIL: admin@example.com
          QUORIVIO_CI_NEW_PASSWORD: ci-only-changed-admin-password-123
        run: python3 tools/ci_editor_postgres.py
      - name: PostgreSQL 18 legacy widget-answer migration (disposable transactional schema)
        env:
          QUORIVIO_CI_MULTI_QUESTION_TEST: '1'
          DATABASE_URL: postgres://quorivio:ci-only-secret@127.0.0.1:5432/quorivio
        run: python3 tools/ci_question_schema_migration_postgres.py
      - name: PostgreSQL independent multi-question widget E2E
        env:
          QUORIVIO_CI_MULTI_QUESTION_TEST: '1'
          QUORIVIO_CI_LOAD_TOKEN: ${{ env.QUORIVIO_CI_LOAD_TOKEN }}
          QUORIVIO_CI_ADMIN_EMAIL: admin@example.com
          QUORIVIO_CI_NEW_PASSWORD: ci-only-changed-admin-password-123
        run: python3 tools/ci_independent_widget_questions_postgres.py
      - name: Chromium participant UI and PostgreSQL lifecycle (opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.browser_test
        timeout-minutes: 5
        env:
          QUORIVIO_CI_ADMIN_EMAIL: admin@example.com
          QUORIVIO_CI_NEW_PASSWORD: ci-only-changed-admin-password-123
          QUORIVIO_CI_LOAD_TOKEN: ${{ env.QUORIVIO_CI_LOAD_TOKEN }}
        run: |
          # Test the actual production frontend served by the API, not Vite.
          # This preserves the strict same-origin CSRF/WebSocket policy.
          curl --fail --silent http://127.0.0.1:8080/ >/dev/null
          python3 tools/ci_browser_participant.py
      - name: Chromium editor PostgreSQL persistence and conflict acceptance (opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.browser_test
        timeout-minutes: 5
        env:
          QUORIVIO_CI_ADMIN_EMAIL: admin@example.com
          QUORIVIO_CI_NEW_PASSWORD: ci-only-changed-admin-password-123
          QUORIVIO_CI_LOAD_TOKEN: ${{ env.QUORIVIO_CI_LOAD_TOKEN }}
        run: |
          python3 tools/ci_widget_title_menu.py
          python3 tools/ci_browser_editor_postgres.py
      - name: Chromium presenter profile upload and anonymous avatar acceptance (opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.browser_test
        timeout-minutes: 5
        env:
          QUORIVIO_CI_ADMIN_EMAIL: admin@example.com
          QUORIVIO_CI_NEW_PASSWORD: ci-only-changed-admin-password-123
          QUORIVIO_CI_LOAD_TOKEN: ${{ env.QUORIVIO_CI_LOAD_TOKEN }}
        run: python3 tools/ci_browser_profile.py
      - name: Upload Chromium real editor failure diagnostics
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.browser_test
        uses: actions/upload-artifact@v4
        with:
          name: chromium-real-editor-failure
          path: /tmp/quorivio-browser-artifacts/
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload Chromium participant failure diagnostics
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.browser_test
        uses: actions/upload-artifact@v4
        with:
          name: chromium-participant-failure
          path: /tmp/quorivio-browser-artifacts/
          if-no-files-found: ignore
          retention-days: 3
      - name: Start second API replica against shared PostgreSQL 18
        env:
          DATABASE_URL: postgres://quorivio:ci-only-secret@127.0.0.1:5432/quorivio
          AUTH_SECRET: ci-only-integration-secret-must-be-long-enough-123
          PUBLIC_BASE_URL: http://127.0.0.1:8080
          PORT: '8081'
          QUORIVIO_ASSET_DIR: /tmp/quorivio-ci-assets
          QUORIVIO_CONVERSION_DIR: /tmp/quorivio-ci-conversions
          LOAD_TEST_TOKEN: ${{ env.QUORIVIO_CI_LOAD_TOKEN }}
        run: |
          node apps/api/dist/server.js > /tmp/quorivio-ci-replica.log 2>&1 &
          echo $! > /tmp/quorivio-ci-replica.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8081/api/health/ready >/dev/null; then break; fi
            if ! kill -0 $(cat /tmp/quorivio-ci-replica.pid) 2>/dev/null; then cat /tmp/quorivio-ci-replica.log; exit 1; fi
            sleep 1
          done
          curl --fail --show-error http://127.0.0.1:8081/api/health/ready
      - name: PostgreSQL two-replica WebSocket and privacy E2E
        env:
          QUORIVIO_CI_LOAD_TOKEN: ${{ env.QUORIVIO_CI_LOAD_TOKEN }}
          QUORIVIO_CI_ADMIN_EMAIL: admin@example.com
          QUORIVIO_CI_NEW_PASSWORD: ci-only-changed-admin-password-123
        run: |
          python3 -m pip install --disable-pip-version-check --break-system-packages 'aiohttp>=3.9,<4'
          python3 tools/ci_live_replicas.py
      - name: Optional 500-participant PostgreSQL/WebSocket acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.capacity_test
        timeout-minutes: 6
        env:
          QUORIVIO_CI_LOAD_TOKEN: ${{ env.QUORIVIO_CI_LOAD_TOKEN }}
          QUORIVIO_CI_ADMIN_EMAIL: admin@example.com
          QUORIVIO_CI_NEW_PASSWORD: ci-only-changed-admin-password-123
        run: python3 tools/ci_capacity_500.py
      - name: PostgreSQL two-replica graceful rolling SIGTERM acceptance
        env:
          QUORIVIO_CI_LOAD_TOKEN: ${{ env.QUORIVIO_CI_LOAD_TOKEN }}
          QUORIVIO_CI_ADMIN_EMAIL: admin@example.com
          QUORIVIO_CI_NEW_PASSWORD: ci-only-changed-admin-password-123
        run: python3 tools/ci_graceful_shutdown.py
      - name: PostgreSQL 18 disaster recovery backup and restore acceptance
        # Fail closed rather than silently skipping the authenticated encryption
        # and key-rotation portion of the disposable restore test.
        env:
          DATABASE_URL: postgres://quorivio:ci-only-secret@127.0.0.1:5432/quorivio
          QUORIVIO_ASSET_DIR: /tmp/quorivio-ci-assets
        run: |
          python3 -m pip install --disable-pip-version-check --break-system-packages 'cryptography>=43,<47'
          python3 tools/ci_backup_restore.py
      - name: Upload sanitized disposable DR rehearsal metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-rehearsal-ci-only
          path: /tmp/quorivio-dr-rehearsal.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop disposable SMTP and remove captured OTPs
        if: always()
        run: |
          if [ -f /tmp/quorivio-ci-smtps/pid ]; then kill "$(cat /tmp/quorivio-ci-smtps/pid)" || true; fi
          if [ -d /tmp/quorivio-ci-smtps ]; then rm -f /tmp/quorivio-ci-smtps/mail.jsonl /tmp/quorivio-ci-smtps/key.pem /tmp/quorivio-ci-smtps/cert.pem; fi
      - name: Stop integration API
        if: always()
        run: |
          if [ -f /tmp/quorivio-ci-replica.pid ]; then kill $(cat /tmp/quorivio-ci-replica.pid) || true; fi
          if [ -f /tmp/quorivio-ci-replica.log ]; then tail -60 /tmp/quorivio-ci-replica.log; fi
          if [ -f /tmp/quorivio-ci-api.pid ]; then kill $(cat /tmp/quorivio-ci-api.pid) || true; fi
          if [ -f /tmp/quorivio-ci-api.log ]; then tail -60 /tmp/quorivio-ci-api.log; fi
      - name: Vulnerability gate (high and critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Install Python conversion and load-test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends poppler-utils libreoffice-impress fonts-dejavu-core
          python3 -m pip install --disable-pip-version-check --break-system-packages 'reportlab>=4,<5' 'python-pptx>=1.0,<2' 'Pillow>=11,<14' 'aiohttp>=3.9,<4'
          python3 -c 'import reportlab' # fail gate rather than skipping the PDF rendering test
          python3 -c 'import pptx, aiohttp' # enforce PPTX and load-test integration prerequisites
      - name: Kubernetes wizard and worker integration tests
        run: |
          PYTHONPATH=tools python3 -m unittest discover -s tools/tests -v
          python3 -m unittest tools.tests.test_import_presentation.TestImport.test_convert_pdf -v
      - name: Verify Kubernetes credential persistence and unique fresh installations
        run: |
          python3 tools/check_k8s_generation.py
          python3 -m unittest tools.tests.test_k8s_ha_hardening -v
      - name: Verify license and documentation
        run: |
          test -s LICENSE && test -s README.md && test -s README.it.md
          test -s docs/GDPR.en.md && test -s docs/GDPR.it.md
          for name in admin-guide user-guide; do for lang in en it; do test -s "docs/manuals/${name}.${lang}.pdf"; done; done
      - name: Verify grouped SHA-256 evidence inventory
        run: |
          python3 tools/verify_rc_checksum_manifest.py
          python3 tools/verify_rc_public_stage_inventory.py
          python3 tools/verify_rc_cycle8_inventory.py
          python3 tools/verify_rc_cycle10_inventory.py
          python3 tools/verify_rc_cycle11_inventory.py --historical
          # Historical SHA-256 receipts remain immutable; only the newest
          # inventory must match the actual committed tree in this CI run.
          python3 tools/verify_rc_cycle14_inventory.py --historical
          python3 tools/verify_rc_cycle16_inventory.py --historical
          python3 tools/verify_rc_cycle17_inventory.py --historical
          python3 tools/verify_rc_cycle18_inventory.py --historical
          python3 tools/verify_rc_cycle19_inventory.py --historical
          python3 tools/verify_rc_cycle20_inventory.py --historical
          python3 tools/verify_rc_cycle21_inventory.py --historical
          python3 tools/verify_rc_cycle22_inventory.py --historical
          python3 tools/verify_rc_cycle23_inventory.py --historical
          python3 tools/verify_rc_cycle24_inventory.py
      - name: Detect credential leaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  cross-browser:
    name: Native Firefox and WebKit acceptance (opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.cross_browser_test
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install reproducibly
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install native Firefox and WebKit with Playwright dependencies
        timeout-minutes: 10
        run: |
          python3 -m pip install --disable-pip-version-check --break-system-packages 'playwright>=1.50,<2'
          python3 -m playwright install --with-deps firefox webkit
      - name: Compile actual TypeScript module and frontend
        run: npm run build
      - name: Native browser keyboard, modal, public slide and reading acceptance
        timeout-minutes: 5
        run: python3 tools/ci_cross_browser_rc.py --engines firefox webkit
      - name: Native browser built React dashboard/editor singleton and portal acceptance
        timeout-minutes: 5
        run: python3 tools/ci_rehearsal_singleton_offline_chromium.py --engines firefox webkit
      - name: Upload cross-browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-webkit-rc-acceptance-failure
          path: /tmp/quorivio-cross-browser-artifacts/
          if-no-files-found: ignore
          retention-days: 3
  image-build:
    name: Container build gate
    needs: validate
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@v4
      - name: Build without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: quorivio:gate
      - name: Build dedicated document converter image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.converter
          push: false
          load: true
          tags: quorivio-converter:gate
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: quorivio:gate
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - name: Scan converter image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: quorivio-converter:gate
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
  kubernetes-api-manifests:
    name: Kubernetes real API manifest schema (opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.kubernetes_manifest_test
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: quorivio-schema
          version: v0.26.0
      - name: Kubernetes server-side schema and admission checks
        run: python3 tools/ci_k8s_apiserver_smoke.py
  kubernetes-runtime:
    name: Kubernetes live single-node runtime and pod replacement (opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.kubernetes_runtime_test
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: quorivio-runtime
          version: v0.26.0
      - name: Build runtime image for disposable KIND (never publish)
        run: docker build -t quorivio:kind-runtime .
      - name: Load locally built image into KIND
        run: kind load docker-image quorivio:kind-runtime --name quorivio-runtime
      - name: Boot PostgreSQL 18 and two API replicas; exercise service and pod replacement
        run: python3 tools/ci_k8s_runtime_smoke.py
      - name: Diagnostics of failed disposable runtime (no manifest/Secret export)
        if: failure()
        run: |
          kubectl -n quorivio-runtime get pods,deploy,sts,pvc -o wide || true
          kubectl -n quorivio-runtime get events --sort-by=.lastTimestamp | tail -40 || true
  runtime-architecture:
    name: OCI amd64/arm64 actual runtime acceptance (opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.runtime_arch_test
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: Build AMD64 without publication
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: quorivio:ci-oci-amd64
      - name: Execute AMD64 non-root runtime against PostgreSQL 18
        run: bash tools/ci_oci_runtime_smoke.sh quorivio:ci-oci-amd64 amd64
      - name: Build ARM64 under QEMU without publication
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: quorivio:ci-oci-arm64
      - name: Execute ARM64 non-root runtime against PostgreSQL 18
        timeout-minutes: 12
        run: bash tools/ci_oci_runtime_smoke.sh quorivio:ci-oci-arm64 arm64
  publish:
    name: Production publication
    if: github.event_name == 'workflow_dispatch' && inputs.publish_image == true && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [validate, image-build]
    runs-on: ubuntu-latest
    environment: production
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify publisher repository
        shell: bash
        run: test "$GITHUB_REPOSITORY" = 'desalvo/quorivio'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: Resolve and validate manual publication labels
        id: label
        shell: bash
        env:
          QUORIVIO_PUBLISH_TAG: ${{ inputs.publish_tag }}
          QUORIVIO_PUBLISH_LATEST: ${{ inputs.publish_latest }}
          QUORIVIO_PUBLISH_IMAGE: ${{ inputs.publish_image }}
        run: bash tools/resolve_image_tags.sh
      - name: Docker Hub authentication
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish approved image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.label.outputs.tags }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/desalvo/quorivio
            org.opencontainers.image.licenses=EUPL-1.2
            org.opencontainers.image.revision=${{ github.sha }}

name: Quorivio CI and Docker Hub
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*', '0.*', '1.*', '2.*']
  workflow_dispatch:
    inputs:
      rc_acceptance_suite:
        description: 'One-click full disposable RC automatic acceptance (all opt-in test gates; NO publishing, NO external hardware or legal sign-off)'
        type: boolean
        default: false
      rc_strict:
        description: 'Fail if any documented RC gate remains unaccepted (manual verification only)'
        type: boolean
        default: false
      publish_image:
        description: 'Explicitly publish a verified multi-architecture image to Docker Hub (never on push/PR/tag automatically)'
        type: boolean
        default: false
      publish_tag:
        description: 'Optional Docker image tag; blank uses sha-<12 characters> or a version git tag'
        type: string
        default: ''
      publish_latest:
        description: 'Also move Docker Hub latest tag (requires publish_image and main ref)'
        type: boolean
        default: false
      browser_test:
        description: 'Run Chromium editor, participant and real PostgreSQL editor UI acceptance (manual opt-in)'
        type: boolean
        default: false
      cross_browser_test:
        description: 'Run independent native Firefox and WebKit focus/geometry CI acceptance (manual opt-in; downloads engines)'
        type: boolean
        default: false
      capacity_test:
        description: 'Run 500-participant disposable PostgreSQL acceptance (manual only)'
        type: boolean
        default: false
      capacity_slo_test:
        description: 'Opt-in 500-participant 90s sustained global p95 join/snapshot latency acceptance on disposable PostgreSQL only'
        type: boolean
        default: false
      kubernetes_manifest_test:
        description: 'API-server dry-run on disposable KIND: NGINX/HAProxy, TLS, RWX, PDB, external/internal database (no runtime/HA certification)'
        type: boolean
        default: false
      kubernetes_runtime_test:
        description: 'Boot two API pods + PostgreSQL 18 on single-node KIND with disposable hostPath RWX; not real multi-node HA/ingress (manual opt-in)'
        type: boolean
        default: false
      kubernetes_multinode_test:
        description: 'Real 2-worker KIND, strict replica placement, ephemeral cross-worker bind, NGINX HTTP ingress and pod recovery (NOT production CSI/HA)' 
        type: boolean
        default: false
      kubernetes_haproxy_test:
        description: 'Real HAProxy Technologies controller on disposable 2-worker KIND with host routing and failover (NOT external CSI/TLS/HA)'
        type: boolean
        default: false
      live_idle_test:
        description: 'Opt-in real PostgreSQL two-replica 70s quiet WebSocket snapshot/freshness acceptance (no production traffic)'
        type: boolean
        default: false
      kubernetes_tls_test:
        description: 'Disposable two-worker KIND true HTTPS ingress via NGINX and HAProxy Technologies, ephemeral TLS, strict SNI, wrong-host and pod recovery (NOT public CA)'
        type: boolean
        default: false
      clamav_runtime_test:
        description: 'Real private ClamAV INSTREAM acceptance with clean + harmless EICAR signature (manual opt-in, no publication)'
        type: boolean
        default: false
      rootless_podman_test:
        description: 'Build and run the real application with rootless Podman and disposable PostgreSQL 18 (manual opt-in; no publishing)'
        type: boolean
        default: false
      runtime_arch_test:
        description: 'Boot amd64 and arm64 images under Docker/QEMU with disposable PostgreSQL 18; not native ARM64, rootless Podman or Kubernetes (manual opt-in)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Production quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: quorivio
          POSTGRES_USER: quorivio
          POSTGRES_PASSWORD: ci-only-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quorivio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      # Fail before dependency installation / database integration if the
      # cumulative archive has silently dropped an immutable receipt.
      - name: Validate historical RC inventory references early
        run: python3 tools/ci_inventory_reference_guard.py
      - name: Validate RC campaign dispatch isolation before dependencies
        run: python3 -m unittest tools.tests.test_rc_cycle77_dispatch_isolation -q
      - name: Validate RC102 editor and explicit commit CI/publish safety before dependencies
        run: |
          python3 -m unittest tools.tests.test_rc_cycle102_editor_and_commit_markers -q
          python3 -m unittest tools.tests.test_rc103_native_thumbnail_reconciliation -q
      - name: Validate active RC release headers against the current inventory
        run: |
          PYTHONPATH=tools python3 tools/verify_rc_release_status.py
          PYTHONPATH=tools python3 -m unittest tools.tests.test_rc_cycle100_release_status_guard -q
      - name: Validate RC105 floating dialogs and selection-only resize geometry before npm
        run: python3 -m unittest tools.tests.test_rc105_editor_floating -q
      - name: Validate RC101 horizontal widget rail and visible editor stage before npm
        run: |
          python3 -m unittest tools.tests.test_rc_cycle101_horizontal_editor_layout -q
      - name: Validate historical documentation acceptance early
        run: |
          PYTHONPATH=tools python3 -m unittest \
            tools.tests.test_rc_cycle35_verified_bootstrap \
            tools.tests.test_rc_cycle57_live_fanout \
            tools.tests.test_rc_cycle58_reconciliation_and_backpressure \
            tools.tests.test_rc_cycle63_missing_inventory_recovery \
            tools.tests.test_rc_cycle65_historical_documentation \
            tools.tests.test_rc_cycle96_ci_date_and_release_status -q
      - name: Validate evolving editor contracts before npm
        run: |
          python3 -m unittest \
            tools.tests.test_rc_cycle37_editor_ux \
            tools.tests.test_rc_cycle84_historical_context_compat \
            tools.tests.test_rc_cycle85_secondary_pointer_context \
            tools.tests.test_rc_cycle43_frontend_compile \
            tools.tests.test_rc_dashboard_widget_appearance_20261027 \
            tools.tests.test_rehearsal_timed_deadline_20261028 \
            tools.tests.test_session_rehearsal \
            tools.tests.test_topic_linked_results_rc_20261028 -q
      - name: Validate RC79 cumulative archive receipt closure before npm
        run: python3 -m unittest tools.tests.test_rc_cycle79_inventory_closure -q
      - name: RC122 historical browser ordering and dynamic release score preflight before npm
        run: PYTHONPATH=tools python3 -m unittest tools.tests.test_rc_cycle122_historical_preflight tools.tests.test_ci_browser_editor_readonly_title tools.tests.test_live_heartbeat_cycle56 -q
      - name: RC124 editor smart guides and absolute grid snapping preflight
        run: python3 -m unittest tools.tests.test_rc124_smart_guides -q
      - name: RC125 native OCI publication safety and fail-closed digest tests before npm
        run: PYTHONPATH=tools python3 -m unittest tools.tests.test_rc125_native_docker_publish -q
      - name: RC123 media lifecycle and bounded explicit Docker publication preflight
        run: python3 -m unittest tools.tests.test_rc_cycle123_media_publish -q
      - name: RC121 JSON backup export and visible errors preflight before npm
        run: python3 -m unittest tools.tests.test_rc_cycle121_json_export -q
      - name: RC120 always-visible autosave conflict regression before npm
        run: python3 -m unittest tools.tests.test_rc_cycle120_conflict_visibility -q
      - name: RC119 content-only autofit and group-duplication preflight before npm
        run: PYTHONPATH=tools python3 -m unittest tools.tests.test_rc_cycle119_autofit_duplication -q
      - name: RC118 localized completion ledger preflight before npm
        run: PYTHONPATH=tools python3 -m unittest tools.tests.test_rc_cycle118_localized_release_headers -q
      - name: RC117 atomic auto-fit Undo regression preflight before npm
        run: python3 -m unittest tools.tests.test_rc_cycle117_autofit_atomic_undo -q
      - name: RC116 exact Chromium group-selection regression preflight before npm
        run: python3 -m unittest tools.tests.test_rc_cycle116_exact_group_selection -q
      - name: RC115 frontend strict-type regression preflight before npm
        run: python3 -m unittest tools.tests.test_rc_cycle115_typescript_strict -q
      - name: RC114 fail-closed JPG background and answer style preflight before npm
        run: python3 -m unittest tools.tests.test_rc_cycle114_editor_preflight -q
      - name: Validate RC89 editor review regressions before npm
        run: python3 -m unittest tools.tests.test_rc_cycle89_editor_feedback -q
      # Keep pure source/DOM contracts in dependency-free preflight. The native
      # PowerPoint assertions need python-pptx, installed in the conversion gate.
      - name: Validate RC90 session actions, slide schemes and footer before npm
        run: |
          python3 -m unittest \
            tools.tests.test_rc90_session_sidebar_master \
            tools.tests.test_rc74_footer_corner.FooterCornerRC74.test_default_footer_occupies_bottom_strip_and_stays_dynamic \
            tools.tests.test_rc74_footer_corner.FooterCornerRC74.test_browser_layout_anchors_number_to_absolute_bottom_right_not_center -q
      - name: Validate RC91 scheme editing and stage numbering before npm
        run: |
          python3 -m unittest \
            tools.tests.test_rc91_scheme_stage.GlobalMasterRegressions.test_footer_number_is_pinned_to_canvas_in_all_four_surfaces \
            tools.tests.test_rc91_scheme_stage.GlobalMasterRegressions.test_editor_works_with_selection_and_persistent_schema \
            tools.tests.test_rc91_scheme_stage.GlobalMasterRegressions.test_pptx_uses_widget_style_override_and_canvas_relative_page_number -q
      - name: Validate RC97 staged PowerPoint prerequisites before npm
        run: python3 -m unittest tools.tests.test_rc_cycle97_pptx_dependency_staging -q
      # This quick source regression does not replace the strict tsc/Vite build
      # in "Compile frontend and backend" after npm install.
      - name: Validate RC99 historical CI contracts and PowerPoint outlines before npm
        run: python3 -m unittest tools.tests.test_rc_cycle99_ci_contract -q
      - name: Validate RC98 presenter and scheme TypeScript fixes before npm
        run: python3 -m unittest tools.tests.test_rc_cycle98_web_compile -q
      - name: Validate RC92 presenter stage, gated navigation and fullscreen before npm
        run: python3 -m unittest tools.tests.test_rc92_presenter_stage -q
      - name: Validate RC93 participant QR and link parity before npm
        run: python3 -m unittest tools.tests.test_rc93_participant_qr_contract -q
      - name: Validate RC78 browser rehearsal preview locators before npm
        run: python3 -m unittest tools.tests.test_rc_cycle78_preview_selector -q
      - name: Validate RC80 real widget context menu pointer before npm
        run: python3 -m unittest tools.tests.test_rc_cycle80_widget_context_hit -q
      - name: Validate RC81 layout-stable widget right click before npm
        run: python3 -m unittest tools.tests.test_rc_cycle81_stable_widget_pointer -q
      - name: Validate RC83 browser-context capture semantics before npm
        run: python3 -m unittest tools.tests.test_rc_cycle83_real_widget_context -q
      - name: Validate RC86 live widget palette semantics before npm
        run: python3 -m unittest tools.tests.test_rc_cycle86_palette_acceptance -q
      - name: Validate deterministic backup tampering and fail-closed mirror before npm
        run: python3 -m unittest tools.tests.test_backup_mirror -q
      - name: Validate RC88 disposable capacity QR URL contracts before npm
        run: python3 -m unittest tools.tests.test_rc_cycle88_capacity_join_url -q
      - name: Validate RC74 footer alignment before npm
        run: |
          python3 -m unittest \
            tools.tests.test_rc74_footer_corner.FooterCornerRC74.test_default_footer_occupies_bottom_strip_and_stays_dynamic \
            tools.tests.test_rc74_footer_corner.FooterCornerRC74.test_browser_layout_anchors_number_to_absolute_bottom_right_not_center -q
      - name: Reconcile verified thumbnail JSON export and new reorder contracts before npm
        run: python3 -m unittest tools.tests.test_rc_cycle69_thumbnail_reorder -q
      - name: Reconcile verified private background library gate receipts before npm
        run: python3 -m unittest tools.tests.test_rc_cycle68_verified_private_backgrounds -q
      - name: Reconcile verified browser rehearsal gate receipts before npm
        run: python3 -m unittest tools.tests.test_rc_cycle67_browser_rehearsal_gate -q
      - name: Reconcile verified SSO gate receipts before npm
        run: python3 -m unittest tools.tests.test_rc_cycle66_verified_sso_reconciliation -q
      - name: Check nonsecret CI token fixture
        run: python3 -m unittest tools.tests.test_rc_cycle64_credential_fixture -q
      - uses: actions/setup-node@v4
        with: {node-version: '22'} # npm caching requires a committed package-lock.json
      - name: Install reproducibly
        run: npm install --ignore-scripts --no-audit --no-fund
      # RC campaigns are strictly observational, regardless of other dispatch
      # checkboxes. Separate consent is required for production publication.
      - name: Validate RC campaign is non-publishing and non-strict
        if: github.event_name == 'workflow_dispatch' && inputs.rc_acceptance_suite || (github.event_name == 'push' && github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[full-ci]') || contains(github.event.head_commit.message, '[publish-docker]')))
        env:
          RC_CAMPAIGN_PUBLISH: 'false'
          RC_CAMPAIGN_STRICT: 'false'
        run: |
          test "$RC_CAMPAIGN_PUBLISH" = 'false'
          test "$RC_CAMPAIGN_STRICT" = 'false'
          python3 tools/rc_campaign_preflight.py --check-workflow
      - name: Publish evidence-based RC readiness diagnostics (non-blocking)
        run: python3 tools/rc_release_preflight.py --output /tmp/quorivio-rc-readiness.json
      - name: Publish RC gate summary in GitHub Actions
        if: success()
        run: python3 tools/ci_rc_gate_summary.py /tmp/quorivio-rc-readiness.json
      - name: Strict release-candidate gate (manual opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.rc_strict && !inputs.rc_acceptance_suite
        run: python3 tools/rc_release_preflight.py --strict
      - name: RC124 smart alignment and absolute grid geometry Node regression
        run: node --experimental-strip-types --test apps/web/test/rc124-smart-guides.test.ts
      - name: RC113 graphical overlays, media upload, inline editing and content fit regressions
        run: node --experimental-strip-types --test apps/web/test/rc113-graphics-upload-fit.test.ts
      - name: RC112 scheme editor ribbon and footer source contracts
        run: python3 -m unittest tools.tests.test_rc112_scheme_ribbon_footer.MasterRibbonAndFooter.test_scheme_widget_rail_and_real_shared_selection tools.tests.test_rc112_scheme_ribbon_footer.MasterRibbonAndFooter.test_shared_canvas_rulers_and_selected_only_handles tools.tests.test_rc112_scheme_ribbon_footer.MasterRibbonAndFooter.test_number_and_separator_remain_strictly_validated -q
      - name: RC111 preview stacking, result wrapping and scheme access preflight
        run: python3 -m unittest tools.tests.test_rc111_preview_results_schemes -q
      - name: RC110 background menu, ranked cloud and free-text sizing preflight
        run: python3 -m unittest tools.tests.test_rc110_background_cloud_answer -q
      - name: RC109 editor response controls, auto-fit and centered footer preflight
        run: python3 -m unittest tools.tests.test_rc109_editor_autofit_answer_footer -q
      - name: RC107 colored Vite startup and WebSocket fail-closed contract
        run: python3 -m unittest tools.tests.test_rc107_colored_preview_readiness -q
      - name: RC106 isolated compiled-preview and floating portal contracts
        run: python3 -m unittest tools.tests.test_rc106_ci_contract tools.tests.test_editor_contextual_layout_v2 -q
      - name: Unit tests
        run: npm test
      - name: Editor autosave recovery and shared geometry unit tests
        run: node --experimental-strip-types --test apps/web/test/*.test.ts
      - name: Compile frontend and backend
        run: npm run build
      - name: Chromium editor UI acceptance (opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.browser_test || (github.event_name == 'workflow_dispatch' && inputs.rc_acceptance_suite) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[full-ci]') || contains(github.event.head_commit.message, '[publish-docker]')))
        timeout-minutes: 8
        run: |
          python3 -m pip install --disable-pip-version-check --break-system-packages 'playwright>=1.50,<2'
          # GitHub-hosted ubuntu-24.04 already has Chrome/Chromium. Avoid apt
          # mirror stalls from installing system packages (CI 40395950707).
          # Smoke and export the exact browser used by every subsequent UI test.
          python3 tools/ci_browser_bootstrap.py --smoke --github-env "$GITHUB_ENV"
          export QUORIVIO_CHROMIUM_PATH="$(sed -n 's/^QUORIVIO_CHROMIUM_PATH=//p' "$GITHUB_ENV" | tail -1)"
          # Exercise exactly the compiled distribution from the preceding build.
          # Vite's dev optimizer intermittently reloads its first ESM imports,
          # leaving a completely empty #root with no JavaScript exception.
          # Preview serves immutable /assets/* with no HMR/optimizer races.
          npm run preview -w @quorivio/web > /tmp/quorivio-ci-preview.log 2>&1 &
          preview_pid=$!
          # Always inspect the *server* log, even when Playwright passes or
          # exits early. Vite's WebSocket ECONNREFUSED is not a pageerror.
          cleanup_preview() {
            rc=$?
            python3 tools/ci_preview_proxy_guard.py /tmp/quorivio-ci-preview.log || rc=1
            kill "$preview_pid" || true
            tail -50 /tmp/quorivio-ci-preview.log
            exit "$rc"
          }
          trap cleanup_preview EXIT
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --show-error http://127.0.0.1:5173/ > /dev/null
          # Verify production HTML advertises fingerprinted JS and CSS, not
          # a dev-only /src/main.tsx module or /@vite/client HMR bootstrap.
          python3 tools/ci_built_frontend_asset_probe.py
          # RC124: actual Chromium alignment-guide geometry/pointer safety, desktop and mobile.
          python3 tools/ci_rc124_alignment_guides_chromium.py
          # RC119: selected resize handles may inflate outer scrollHeight, but never content auto-fit.
          python3 tools/ci_rc119_autofit_handles_chromium.py
          # Real browser CSS preflight: catch hidden nested actions before UI acceptance.
          python3 tools/ci_nested_context_css_chromium.py
          python3 tools/ci_accessible_disclosure_chromium.py
          # Fail fast on accessible-name ambiguity introduced by icon-only Save.
          python3 tools/ci_editor_save_locator_chromium.py
          # Actual editor geometry: expanded keyboard/touch controls must not cover Save.
          python3 tools/ci_editor_save_flow_chromium.py
          python3 tools/ci_editor_mock_layout_chromium.py
          # RC105: selected-only, pixel-aligned handles and viewport-floating palette.
          python3 tools/ci_editor_floating_layout_chromium.py
          # Regression: a fixed mock header may cover the 7px canvas corner after scrolling.
          python3 tools/ci_canvas_context_hit_target_chromium.py
          # Real Chromium regression: header must not intercept canvas context
          # or selection/layer controls (full run 40589103128).
          python3 tools/ci_editor_context_header_overlay_chromium.py
          python3 tools/ci_background_context_portal_chromium.py
          # Geometric parity across editor, rehearsal and audience at 1440px / 390px.
          python3 tools/ci_widget_visual_geometry_20261028.py
          python3 tools/ci_rc112_scheme_canvas_chromium.py
          # Dual presenter/participant preview must preserve 16:9 and real reaction hit targets.
          python3 tools/ci_preview_layout_offline.py
          # Actual TS keyboard module: modal focus trap, Escape and scroll cleanup, 1440/390px.
          python3 tools/ci_rehearsal_keyboard_chromium.py
          # Same production module and page geometry as the opt-in native Firefox/WebKit job.
          python3 tools/ci_cross_browser_rc.py --engines chromium
          # Real preview response-state module: draft vs send, same-page reaction lock, reset.
          python3 tools/ci_rehearsal_submission_chromium.py
          python3 tools/ci_rehearsal_timer_chromium.py
          # Real production React WYSIWYG component, caret/selection and live styles.
          python3 tools/ci_browser_rich_text_offline.py
          # Real bundled React without HTTP: exactly one accessible rehearsal
          # from both dashboard and editor (regression for CI 40689633215).
          # Public participant 16:9 stage and an accessible linear-reading alternative.
          python3 tools/ci_rc_public_stage_chromium.py
          # The real TS rehearsal handler also isolates portals created after opening.
          python3 tools/ci_rc111_preview_results_chromium.py
          python3 tools/ci_rc_rehearsal_dynamic_portals_chromium.py
          python3 tools/ci_rehearsal_singleton_offline_chromium.py
          # Real built React: one-time account recovery bearer never lingers in URL/history.
          python3 tools/ci_recovery_url_chromium.py
          # Native modal must be acknowledged before querying page controls.
          python3 tools/ci_cookie_modal_order_chromium.py
          python3 tools/ci_browser_editor.py
          # Actual native Chromium drag, ambiguous PUT acknowledgement, server readback and keyboard persistence.
          python3 tools/ci_page_thumbnail_native.py --engines chromium
      - name: Upload Chromium failure diagnostics
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.browser_test || (failure() && github.event_name == 'workflow_dispatch' && inputs.rc_acceptance_suite) || (failure() && (github.event_name == 'push' && github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[full-ci]') || contains(github.event.head_commit.message, '[publish-docker]'))))
        uses: actions/upload-artifact@v4
        with:
          name: chromium-editor-failure
          path: /tmp/quorivio-browser-artifacts/
          if-no-files-found: ignore
          retention-days: 3
      - name: Install PostgreSQL 18 client for integration and disaster recovery
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo '/usr/lib/postgresql/18/bin' >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version | grep -Eq '^pg_dump \(PostgreSQL\) 18\.'
          /usr/lib/postgresql/18/bin/pg_restore --version | grep -Eq '^pg_restore \(PostgreSQL\) 18\.'
      - name: Generate ephemeral CI load and SMTP credentials
        run: |
          load_token="$(openssl rand -hex 32)"
          smtp_password="$(openssl rand -hex 32)"
          echo "::add-mask::$load_token"
          echo "::add-mask::$smtp_password"
          echo "QUORIVIO_CI_LOAD_TOKEN=$load_token" >> "$GITHUB_ENV"
          echo "QUORIVIO_CI_SMTP_PASSWORD=$smtp_password" >> "$GITHUB_ENV"
      - name: Start disposable loopback SMTPS for real email MFA acceptance
        shell: bash
        run: |
          mkdir -p /tmp/quorivio-ci-smtps
          chmod 700 /tmp/quorivio-ci-smtps
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -keyout /tmp/quorivio-ci-smtps/key.pem -out /tmp/quorivio-ci-smtps/cert.pem \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' >/dev/null 2>&1
          chmod 600 /tmp/quorivio-ci-smtps/key.pem /tmp/quorivio-ci-smtps/cert.pem
          QUORIVIO_CI_SMTP_PASSWORD="$QUORIVIO_CI_SMTP_PASSWORD" \
          QUORIVIO_CI_SMTP_TEST=1 \
          QUORIVIO_CI_SMTP_CERT=/tmp/quorivio-ci-smtps/cert.pem \
          QUORIVIO_CI_SMTP_KEY=/tmp/quorivio-ci-smtps/key.pem \
          QUORIVIO_CI_SMTP_CAPTURE=/tmp/quorivio-ci-smtps/mail.jsonl \
            python3 tools/ci_smtps_capture.py > /tmp/quorivio-ci-smtps/daemon.log 2>&1 &
          echo $! > /tmp/quorivio-ci-smtps/pid
          for i in $(seq 1 30); do
            if test -f /tmp/quorivio-ci-smtps/mail.jsonl && bash -c 'echo >/dev/tcp/127.0.0.1/2465' 2>/dev/null; then break; fi
            if ! kill -0 "$(cat /tmp/quorivio-ci-smtps/pid)" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          bash -c 'echo >/dev/tcp/127.0.0.1/2465'
      - name: PostgreSQL 18 concurrent fresh-schema bootstrap and atomic first-admin acceptance
        timeout-minutes: 4
        run: python3 tools/ci_concurrent_bootstrap_postgres.py
      - name: Start API against real PostgreSQL
        env:
          DATABASE_URL: postgres://quorivio:ci-only-secret@127.0.0.1:5432/quorivio
          AUTH_SECRET: ci-only-integration-secret-must-be-long-enough-123
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: ci-only-administrator-password-123
          PUBLIC_BASE_URL: http://127.0.0.1:8080
          PORT: '8080'
          QUORIVIO_ASSET_DIR: /tmp/quorivio-ci-assets
          QUORIVIO_CONVERSION_DIR: /tmp/quorivio-ci-conversions
          LOAD_TEST_TOKEN: ${{ env.QUORIVIO_CI_LOAD_TOKEN }}
          NODE_EXTRA_CA_CERTS: /tmp/quorivio-ci-smtps/cert.pem
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: '2465'
          SMTP_SECURE: 'true'

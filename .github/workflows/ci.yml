  runtime-podman-rootless:
    name: Rootless Podman PostgreSQL runtime acceptance (opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.rootless_podman_test || (github.event_name == 'workflow_dispatch' && inputs.rc_acceptance_suite) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[full-ci]') || contains(github.event.head_commit.message, '[publish-docker]')))
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install rootless container engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman uidmap slirp4netns fuse-overlayfs
          test "$(id -u)" -ne 0
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
      - name: Build locally as rootless user (no publication)
        run: podman build --format docker --pull=always -t quorivio:ci-rootless .
      - name: Execute rootless Podman and PostgreSQL 18 application acceptance
        run: bash tools/ci_rootless_podman_smoke.sh quorivio:ci-rootless
  clamav-runtime:
    name: Real ClamAV signature and production fail-closed acceptance (opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.clamav_runtime_test || (github.event_name == 'workflow_dispatch' && inputs.rc_acceptance_suite) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[full-ci]') || contains(github.event.head_commit.message, '[publish-docker]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Start disposable ClamAV with private loopback-only port
        run: |
          docker run -d --name quorivio-ci-clamav --memory=4g \
            --security-opt no-new-privileges:true -p 127.0.0.1:23310:3310 \
            clamav/clamav:stable
      - name: Wait for clamd PING/PONG and loaded signature database
        timeout-minutes: 7
        run: node --experimental-strip-types tools/ci_clamav_real.mjs --wait-ready
      - name: Verify clean upload and EICAR detection through real ClamAV INSTREAM
        timeout-minutes: 3
        run: node --experimental-strip-types tools/ci_clamav_real.mjs
      - name: Remove disposable ClamAV container
        if: always()
        run: docker rm -f quorivio-ci-clamav >/dev/null 2>&1 || true

  rc-campaign-conclusion:
    name: Full automatic RC campaign acceptance summary (opt-in)
    if: always() && github.event_name == 'workflow_dispatch' && inputs.rc_acceptance_suite || (github.event_name == 'push' && github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[full-ci]') || contains(github.event.head_commit.message, '[publish-docker]')))
    needs:
      - validate
      - cross-browser
      - image-build
      - kubernetes-api-manifests
      - kubernetes-runtime
      - kubernetes-multinode-ingress
      - kubernetes-https-ingress
      - kubernetes-haproxy-ingress
      - runtime-architecture
      - runtime-podman-rootless
      - clamav-runtime
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Fail closed on skipped, cancelled or failed RC campaign jobs
        env:
          RC_CAMPAIGN_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 tools/rc_campaign_result_gate.py
  publish-platform:
    name: Native OCI image (${{ matrix.arch }})
    # An amd64 runner using QEMU can stall in npm install for arm64 after
    # `qemu: uncaught target signal 4`. Never emulate the publication build.
    if: >-
      ${{ always() && github.repository == 'desalvo/quorivio' &&
          ((github.event_name == 'workflow_dispatch' && inputs.publish_image == true &&
            !inputs.rc_acceptance_suite &&
            (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
            needs.validate.result == 'success' && needs.image-build.result == 'success') ||
           (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
            contains(github.event.head_commit.message, '[publish-docker]') &&
            needs.validate.result == 'success' && needs.image-build.result == 'success' &&
            needs.rc-campaign-conclusion.result == 'success')) }}
    needs: [validate, image-build, rc-campaign-conclusion]
    strategy:
      fail-fast: true
      matrix:
        include:
          - {arch: amd64, platform: linux/amd64, runner: ubuntu-24.04}
          - {arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    environment: production
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify authorized native publishing runner
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          QUORIVIO_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          QUORIVIO_CAMPAIGN_CONCLUSION: ${{ needs.rc-campaign-conclusion.result }}
          QUORIVIO_PUBLISH_IMAGE: ${{ inputs.publish_image }}
          QUORIVIO_RC_ACCEPTANCE_SUITE: ${{ inputs.rc_acceptance_suite }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'desalvo/quorivio'
          test "$(uname -m)" = "$([ "$EXPECTED_ARCH" = arm64 ] && echo aarch64 || echo x86_64)"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$QUORIVIO_CAMPAIGN_CONCLUSION" = success
            [[ "$QUORIVIO_COMMIT_MESSAGE" == *'[publish-docker]'* ]]
          else
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$QUORIVIO_PUBLISH_IMAGE" = true
            test "$QUORIVIO_RC_ACCEPTANCE_SUITE" != true
          fi
      - uses: docker/setup-buildx-action@v3
      - name: Docker Hub authentication
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push a single native architecture by immutable digest only
        id: native-build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=desalvo/quorivio,push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/desalvo/quorivio
            org.opencontainers.image.licenses=EUPL-1.2
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record validated native image digest
        env:
          IMAGE_DIGEST: ${{ steps.native-build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Invalid OCI image digest'; exit 1; }
          mkdir -p digests
          printf '%s\n' "$IMAGE_DIGEST" > "digests/$ARCH.digest"
      - name: Transfer digest for atomic multiarch manifest publication
        uses: actions/upload-artifact@v4
        with:
          name: quorivio-native-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: digests/${{ matrix.arch }}.digest
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Verified multiarch Docker Hub publication (manual)
    if: >-
      ${{ always() && github.event_name == 'workflow_dispatch' && inputs.publish_image == true &&
          !inputs.rc_acceptance_suite &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
          needs.validate.result == 'success' && needs.image-build.result == 'success' &&
          needs.publish-platform.result == 'success' }}
    needs: [validate, image-build, publish-platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify publisher repository
        run: test "$GITHUB_REPOSITORY" = 'desalvo/quorivio'
      - name: Resolve and validate manual publication labels
        id: label
        env:
          QUORIVIO_PUBLISH_TAG: ${{ inputs.publish_tag }}
          QUORIVIO_PUBLISH_LATEST: ${{ inputs.publish_latest }}
          QUORIVIO_PUBLISH_IMAGE: ${{ inputs.publish_image }}
          QUORIVIO_RC_ACCEPTANCE_SUITE: ${{ inputs.rc_acceptance_suite }}
        run: bash tools/resolve_image_tags.sh
      - uses: docker/setup-buildx-action@v3
      - name: Docker Hub authentication
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: quorivio-native-*-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: true
          path: digests
      - name: Assemble and verify both native images before tagging
        env:
          QUORIVIO_IMAGE_TAGS: ${{ steps.label.outputs.tags }}
          QUORIVIO_DIGEST_DIR: digests
        run: bash tools/publish_multiarch_manifest.sh

  publish-on-commit:
    name: Verified multiarch Docker Hub publication (explicit commit)
    timeout-minutes: 10
    if: >-
      ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          contains(github.event.head_commit.message, '[publish-docker]') &&
          needs.validate.result == 'success' && needs.image-build.result == 'success' &&
          needs.rc-campaign-conclusion.result == 'success' && needs.publish-platform.result == 'success' }}
    needs: [validate, image-build, rc-campaign-conclusion, publish-platform]
    runs-on: ubuntu-24.04
    environment: production
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify publisher repository
        run: test "$GITHUB_REPOSITORY" = 'desalvo/quorivio'
      - name: Verify explicit commit publication authorization and full gate result
        id: label
        env:
          QUORIVIO_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          QUORIVIO_CAMPAIGN_CONCLUSION: ${{ needs.rc-campaign-conclusion.result }}
        run: bash tools/resolve_commit_image_tags.sh
      - uses: docker/setup-buildx-action@v3
      - name: Docker Hub authentication
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: quorivio-native-*-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: true
          path: digests
      - name: Assemble and verify both native images before tagging
        env:
          QUORIVIO_IMAGE_TAGS: ${{ steps.label.outputs.tags }}
          QUORIVIO_DIGEST_DIR: digests
        run: bash tools/publish_multiarch_manifest.sh
